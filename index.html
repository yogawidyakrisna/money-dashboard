<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Money">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Money</title>
<style>
  /* iOS system colors and grouped-list layout (Human Interface Guidelines). */
  :root {
    --bg: #f2f2f7; --cell: #ffffff; --label: #000000; --label2: rgba(60,60,67,.6); --label3: rgba(60,60,67,.3);
    --sep: rgba(60,60,67,.29); --fill: rgba(120,120,128,.16); --tint: #007aff; --green: #34c759; --red: #ff3b30;
    --orange: #ff9500; --bar: rgba(249,249,249,.94); --sheet: #f2f2f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --cell: #1c1c1e; --label: #ffffff; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3);
      --sep: rgba(84,84,88,.65); --fill: rgba(120,120,128,.32); --tint: #0a84ff; --green: #30d158; --red: #ff453a;
      --orange: #ff9f0a; --bar: rgba(22,22,24,.94); --sheet: #1c1c1e;
    }
    .sheet .group { background: #2c2c2e; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--label); }
  body { font: 17px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .screen { max-width: 600px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 10px) 0 calc(env(safe-area-inset-bottom) + 96px); }
  .title-row { display: flex; align-items: flex-end; justify-content: space-between; padding: 0 16px; }
  .large-title { font-size: 34px; line-height: 41px; font-weight: 700; letter-spacing: .37px; margin: 0; }
  .subtitle { color: var(--label2); font-size: 15px; padding: 2px 16px 0; }
  .cycle-nav { display: flex; gap: 6px; padding-bottom: 5px; }
  .cycle-nav button { border: 0; background: var(--fill); color: var(--tint); width: 32px; height: 32px; border-radius: 16px; font-size: 19px; line-height: 1; }
  .cycle-nav button:disabled { color: var(--label3); }
  .section { margin: 22px 16px 0; }
  .header { display: flex; justify-content: space-between; font-size: 13px; color: var(--label2); letter-spacing: -.08px; padding: 0 16px 7px; }
  .header > span:first-child { text-transform: uppercase; }
  .footnote { font-size: 13px; color: var(--label2); padding: 7px 16px 0; line-height: 1.35; }
  .group { background: var(--cell); border-radius: 10px; overflow: hidden; }
  .cell { position: relative; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 11px 16px; color: inherit; }
  .cell + .cell::before { content: ''; position: absolute; top: 0; left: 16px; right: 0; border-top: .5px solid var(--sep); }
  .cell.tap { cursor: pointer; }
  .cell.tap:active { background: var(--fill); }
  .cell .main { flex: 1; min-width: 0; }
  .cell .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .wrap { white-space: normal; line-height: 1.35; }
  .cell .s { font-size: 15px; color: var(--label2); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cell .s.wrap { white-space: normal; }
  .d { color: var(--label2); }
  .chev { color: var(--label3); font-size: 22px; line-height: 1; margin-left: -4px; }
  .link { color: var(--tint); text-decoration: none; }
  .red { color: var(--red); } .green { color: var(--green); } .orange { color: var(--orange); } .muted { color: var(--label2); }
  .hero { padding: 16px; }
  .hero .k { font-size: 15px; color: var(--label2); }
  .hero .v { font-size: 34px; font-weight: 700; letter-spacing: .3px; margin: 2px 0; font-variant-numeric: tabular-nums; }
  svg.spark { width: 100%; height: 40px; display: block; margin-top: 10px; }
  .icon { width: 29px; height: 29px; border-radius: 7px; display: grid; place-items: center; flex: none; color: #fff; }
  .icon svg { width: 17px; height: 17px; }
  .progress { height: 4px; border-radius: 2px; background: var(--fill); overflow: hidden; margin-top: 8px; }
  .progress > div { height: 100%; border-radius: 2px; background: var(--tint); }
  .progress > .warn { background: var(--orange); } .progress > .over { background: var(--red); }
  .chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 6px; border-radius: 5px; margin-left: 6px; vertical-align: 2px; background: rgba(255,149,0,.18); color: var(--orange); }
  .chip.gray { background: var(--fill); color: var(--label2); }
  .struck { text-decoration: line-through; opacity: .55; }
  .empty { color: var(--label2); text-align: center; padding: 40px 24px; font-size: 15px; }
  .segment { display: flex; background: var(--fill); border-radius: 9px; padding: 2px; margin: 14px 16px 0; }
  .segment button { flex: 1; border: 0; background: none; padding: 6px 0; border-radius: 7px; font-size: 13px; font-weight: 600; }
  .segment button.on { background: var(--cell); box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04); }
  .status { text-align: center; color: var(--label2); font-size: 12px; margin-top: 16px; min-height: 15px; }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--sep); padding-bottom: env(safe-area-inset-bottom); }
  .tabbar .in { max-width: 600px; margin: 0 auto; display: flex; height: 49px; }
  .tabbar button { flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; font-weight: 500; color: #999; }
  .tabbar button.on { color: var(--tint); }
  .tabbar svg { width: 25px; height: 25px; }
  .sheet-bg { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.4); display: none; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--sheet); width: 100%; max-width: 600px; max-height: 92vh; overflow-y: auto; border-radius: 12px 12px 0 0; padding-bottom: calc(env(safe-area-inset-bottom) + 24px); }
  .sheet-bar { position: sticky; top: 0; z-index: 1; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 6px 16px 10px; background: var(--sheet); }
  .sheet-bar::before { content: ''; position: absolute; top: 5px; left: 50%; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: var(--label3); }
  .sheet-bar .ttl { font-weight: 600; padding-top: 12px; text-align: center; }
  .sheet-bar button { border: 0; background: none; color: var(--tint); padding: 12px 0 0; justify-self: start; }
  .sheet-bar button.r { justify-self: end; font-weight: 600; }
  .field { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .field input, .field select { border: 0; background: none; text-align: right; color: var(--label2); padding: 0; min-width: 0; flex: 1; -webkit-appearance: none; appearance: none; }
  .field select { direction: rtl; }
  .field input:focus { outline: none; color: var(--label); }
  .err { color: var(--red); font-size: 13px; padding: 7px 16px 0; min-height: 20px; }
  .btn { display: block; width: 100%; border: 0; border-radius: 12px; background: var(--tint); color: #fff; font-weight: 600; padding: 14px; }
  .shot { width: 100%; display: block; border-radius: 10px; }
</style>
</head>
<body>
<div id="app"><p class="status" style="padding-top:40vh">Loading…</p></div>
<nav class="tabbar"><div class="in">
  <button data-tab="summary"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 2.05A10 10 0 1 0 21.95 13H11z"/><path d="M13 2.05V11h8.95A10 10 0 0 0 13 2.05z" opacity=".55"/></svg>Summary</button>
  <button data-tab="transactions"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="6" r="1.6"/><circle cx="5" cy="12" r="1.6"/><circle cx="5" cy="18" r="1.6"/><rect x="9" y="5" width="12" height="2" rx="1"/><rect x="9" y="11" width="12" height="2" rx="1"/><rect x="9" y="17" width="12" height="2" rx="1"/></svg>Transactions</button>
  <button data-tab="activity"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Activity</button>
</div></nav>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<script>
const API = 'https://vxyofgwxkeruvaxqqzhq.supabase.co/functions/v1/api';
const INGEST = API.replace(/\/api$/, '/ingest');
const params = new URLSearchParams(location.search);
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (_) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} } };
if (params.get('k')) store.set('money:key', params.get('k'));
const KEY = params.get('k') || store.get('money:key');

const S = { tab: store.get('money:tab') || 'summary', data: store.get('money:dash'), activity: store.get('money:activity'), cycle: null,
  filter: 'all', loading: false, error: '', at: 0 };
let poll = null;

const rp = n => (n < 0 ? '−' : '') + 'Rp' + String(Math.abs(Math.round(n || 0))).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ago = ms => { if (!ms) return 'No balance yet'; const d = Math.floor((Date.now() - ms) / 864e5); return d <= 0 ? 'Updated today' : d === 1 ? 'Updated yesterday' : 'Updated ' + d + ' days ago'; };
const when = ms => new Date(ms).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const ICON = {
  spark: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/></svg>',
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  dup: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="10.4" y="3.5" width="3.2" height="11.5" rx="1.6"/><circle cx="12" cy="19.2" r="1.9"/></svg>',
  none: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M8 12h8"/></svg>',
};

async function api(method, body, query) {
  const res = await fetch(API + (query || ''), { method, cache: 'no-store',
    headers: { 'x-key': KEY, ...(body ? { 'content-type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || data.message || 'HTTP ' + res.status);
  return data;
}

async function load() {
  if (!KEY) { document.getElementById('app').innerHTML = '<div class="empty">Open the dashboard with your private link (it ends in ?k=…).</div>'; return; }
  S.loading = true; S.error = ''; status();
  try {
    const jobs = [api('GET', null, S.cycle ? '?cycle=' + S.cycle : '')];
    if (S.tab === 'activity') jobs.push(api('GET', null, '?view=activity'));
    const [d, a] = await Promise.all(jobs);
    S.data = d; if (!S.cycle) store.set('money:dash', d);
    if (a) { S.activity = a; store.set('money:activity', a); }
    S.at = Date.now();
    render();
    clearTimeout(poll);
    if (d.reports.pending.length && document.visibilityState === 'visible') poll = setTimeout(load, 15000);
  } catch (e) {
    S.error = e.message === 'Failed to fetch' || e.message === 'Load failed' ? 'Offline. Showing your last numbers.' : e.message;
  } finally { S.loading = false; status(); }
}

function status() {
  const el = document.getElementById('status');
  if (el) el.textContent = S.error || (S.loading ? 'Updating…' : S.at ? 'Updated ' + new Date(S.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '');
}

// ---------- Summary ----------

function spark(trend) {
  if (!trend || trend.length < 2) return '';
  const v = trend.map(t => t.total), lo = Math.min(...v), span = Math.max(...v) - lo || 1;
  const pts = trend.map((t, i) => (i / (trend.length - 1) * 100).toFixed(2) + ',' + (36 - (t.total - lo) / span * 32).toFixed(2)).join(' ');
  return `<svg class="spark" viewBox="0 0 100 40" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--tint)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}

function summary(d) {
  const nw = d.netWorth, known = nw.accounts.filter(a => a.hasSnapshot), r = d.reports, b = d.budgets;
  const writing = r.pending.length;
  const newest = r.weekly && !r.weekly.pending && !r.weekly.error && r.weekly.created_at > ((r.monthly && r.monthly.created_at) || 0) ? 'weekly' : 'monthly';
  const canOpen = r[newest] && !r[newest].pending && !r[newest].error;
  const budgetRows = b.rows.map(x => {
    const cls = x.pct === null ? '' : x.pct > 100 ? 'over' : x.pct >= 80 ? 'warn' : '';
    return `<div class="cell tap" data-act="cat"><div class="main">
      <div class="field"><span class="t">${esc(x.category)}</span><span class="num d">${rp(x.spent)}${x.limit ? ' of ' + rp(x.limit) : ''}</span></div>
      ${x.limit ? `<div class="progress"><div class="${cls}" style="width:${Math.min(100, Math.max(2, x.pct))}%"></div></div>` : ''}
    </div></div>`;
  }).join('');
  return `
  <div class="title-row"><h1 class="large-title">Money</h1>
    <div class="cycle-nav"><button data-act="prev" aria-label="Previous cycle">‹</button><button data-act="next" aria-label="Next cycle" ${d.cycle.isCurrent ? 'disabled' : ''}>›</button></div></div>
  <div class="subtitle">${esc(d.cycle.label)} · ${d.cycle.isCurrent ? d.cycle.daysLeft + ' days to payday' : 'past cycle'}</div>

  <div class="section"><div class="group"><div class="hero">
    <div class="k">Net worth</div>
    <div class="v">${known.length ? rp(nw.total) : '—'}</div>
    <div class="k">${known.length ? (nw.runwayMonths !== null ? 'Covers about ' + String(nw.runwayMonths).replace('.', ',') + ' months of spending' : known.length + ' of ' + nw.accounts.length + ' accounts known') : 'Screenshot a balance screen to start'}</div>
    ${spark(nw.trend)}
  </div></div></div>

  ${r.advice || writing ? `<div class="section"><div class="group"><div class="cell ${canOpen ? 'tap' : ''}" data-act="${canOpen ? 'report' : ''}" data-id="${newest}">
    <div class="icon" style="background:var(--tint)">${ICON.spark}</div>
    <div class="main"><div class="s" style="margin:0 0 2px">Your CFO</div><div class="wrap">${r.advice ? esc(r.advice) : 'Looking at your numbers…'}</div>
      ${writing ? '<div class="s">Writing a new report…</div>' : ''}</div>
    ${canOpen ? '<span class="chev">›</span>' : ''}</div></div></div>` : ''}

  <div class="section"><div class="header"><span>This cycle</span></div><div class="group">
    <div class="cell"><div class="main">Spent</div><span class="num d">${rp(d.spent)}</span></div>
    <div class="cell"><div class="main">Income</div><span class="num d">${rp(d.income)}</span></div>
    <div class="cell"><div class="main">${d.saved < 0 ? 'Overspent' : 'Saved'}</div><span class="num ${d.saved < 0 ? 'red' : 'green'}">${rp(Math.abs(d.saved))}</span></div>
    ${d.untracked < 0 ? `<div class="cell"><div class="main">Untracked spending</div><span class="num orange">${rp(-d.untracked)}</span></div>` : ''}
  </div>${d.cycle.isCurrent && d.spent ? `<div class="footnote">At this pace you'll spend about ${rp(d.projected)} by payday.</div>` : ''}</div>

  <div class="section"><div class="header"><span>Budget</span><span>${b.state === 'approved' ? 'Approved' : ''}</span></div><div class="group">
    ${b.state === 'proposed' ? `<div class="cell tap" data-act="plan"><div class="main"><div class="link">Review proposed budget</div><div class="s">Your CFO suggested limits for this cycle</div></div><span class="chev">›</span></div>` : ''}
    ${b.state === 'none' ? (r.pending.includes('monthly') ? '<div class="cell"><div class="main muted">Your CFO is writing a budget…</div></div>'
      : d.cycle.isCurrent ? '<div class="cell tap" data-act="ask" data-id="monthly"><div class="main link">Ask the CFO for a budget</div></div>' : '<div class="cell"><div class="main muted">No budget for this cycle</div></div>') : ''}
    ${b.state !== 'proposed' ? budgetRows : ''}
    ${b.emergency && b.state !== 'proposed' ? `<div class="cell"><div class="main"><div class="field"><span>Emergency fund</span><span class="num d">${rp(b.emergency.amount)}</span></div><div class="s">Set aside this cycle · saved so far ${rp(Math.max(0, d.saved))}</div></div></div>` : ''}
    ${b.state === 'approved' && d.cycle.isCurrent ? '<div class="cell tap" data-act="plan"><div class="main link">Edit budget</div></div>' : ''}
  </div></div>

  <div class="section"><div class="header"><span>Accounts</span></div><div class="group">
    ${nw.accounts.map(a => `<div class="cell"><div class="main"><div class="t">${esc(a.name)}</div><div class="s">${esc(ago(a.asOf))}</div></div><span class="num ${a.hasSnapshot ? '' : 'muted'}">${a.hasSnapshot ? rp(a.balance) : '—'}</span></div>`).join('')}
  </div><div class="footnote">Screenshot an account's balance screen any time to correct it.</div></div>

  <div class="section"><div class="header"><span>Reports</span></div><div class="group">
    ${reportRow(r.monthly, 'Pay-cycle report', 'monthly', d)}
    ${reportRow(r.weekly, 'Weekly check-in', 'weekly', d)}
  </div></div>

  <div class="section"><div class="group">
    <a class="cell tap link" href="${esc(API)}?export=csv&k=${encodeURIComponent(KEY)}">Export transactions (CSV)</a>
    <div class="cell tap" data-act="copy"><div class="main link">Copy Shortcut URL</div></div>
  </div><div class="footnote">AI cost this cycle: $${d.aiCost.toFixed(3)} · ${d.screenshots} screenshots</div></div>`;
}

function reportRow(r, label, kind, d) {
  if (!r) return d.cycle.isCurrent ? `<div class="cell tap" data-act="ask" data-id="${kind}"><div class="main"><div>${label}</div><div class="s">${kind === 'weekly' ? 'Arrives Sunday evening · tap to ask now' : 'Tap to ask now'}</div></div><span class="chev">›</span></div>` : '';
  if (r.pending) return `<div class="cell"><div class="main"><div>${label}</div><div class="s">Writing…</div></div></div>`;
  if (r.error) return `<div class="cell tap" data-act="ask" data-id="${kind}"><div class="main"><div>${label}</div><div class="s red">Failed · tap to try again</div></div></div>`;
  return `<div class="cell tap" data-act="report" data-id="${kind}"><div class="main"><div class="t">${label}</div><div class="s">${esc(r.title)}</div></div><span class="d" style="font-size:15px">${new Date(r.created_at).toLocaleDateString([], { day: 'numeric', month: 'short' })}</span><span class="chev">›</span></div>`;
}

// ---------- Transactions ----------

function txRow(t, sub, act) {
  const sign = t.direction === 'in' ? 'green' : t.direction === 'transfer' ? 'muted' : '';
  const amount = (t.direction === 'in' ? '+' : t.direction === 'out' ? '−' : '') + rp(t.amount);
  const chip = t.status === 'ok' ? '' : `<span class="chip ${t.status === 'check' ? '' : 'gray'}">${t.status === 'duplicate?' ? 'duplicate' : esc(t.status)}</span>`;
  return `<div class="cell ${act ? 'tap' : ''}" data-act="${act || ''}" data-id="${t.id}"><div class="main">
    <div class="t">${esc(t.merchant || t.category)}${chip}</div><div class="s">${esc(sub)}</div></div>
    <span class="num ${sign} ${t.status === 'ignore' || t.status === 'duplicate?' ? 'struck' : ''}">${amount}</span></div>`;
}

function transactions(d) {
  const review = t => t.status === 'check' || t.status === 'duplicate?';
  const days = d.days.map(g => ({ ...g, txs: S.filter === 'review' ? g.txs.filter(review) : g.txs })).filter(g => g.txs.length);
  const count = d.days.reduce((n, g) => n + g.txs.filter(review).length, 0);
  return `<div class="title-row"><h1 class="large-title">Transactions</h1></div>
    <div class="subtitle">${esc(d.cycle.label)}</div>
    ${count ? `<div class="segment"><button data-act="filter" data-id="all" class="${S.filter === 'all' ? 'on' : ''}">All</button><button data-act="filter" data-id="review" class="${S.filter === 'review' ? 'on' : ''}">Needs Review (${count})</button></div>` : ''}
    ${days.length ? days.map(g => `<div class="section"><div class="header"><span>${esc(g.label)}</span><span class="num">${g.spent ? rp(-g.spent) : ''}</span></div>
      <div class="group">${g.txs.map(t => txRow(t, (t.direction === 'transfer' ? t.account + ' → ' + t.to : t.category + ' · ' + t.account) + ' · ' + t.time, 'edit')).join('')}</div></div>`).join('')
      : `<div class="empty">${S.filter === 'review' ? 'Nothing needs review.' : 'Double-tap the back of your iPhone on a receipt to log your first transaction.'}</div>`}
    <div class="footnote" style="padding-top:12px">Tap a transaction to fix it. "Duplicate" and "ignore" don't count toward your balances.</div>`;
}

// ---------- Activity ----------

function activityInfo(a) {
  if (a.status === 'error') return { icon: ICON.warn, color: 'var(--red)', sub: 'Error' };
  if (a.status === 'duplicate') return { icon: ICON.dup, color: '#8e8e93', sub: 'Same screenshot as before' };
  if (a.status === 'dry_run') return { icon: ICON.none, color: '#8e8e93', sub: 'Test' };
  const open = (a.unassigned || []).filter(u => !u.assigned).length;
  const bits = [];
  if (a.saved.length) bits.push(a.saved.length + ' saved');
  if (a.balances.length) bits.push(a.balances.length + (a.balances.length === 1 ? ' balance' : ' balances'));
  if (a.skipped.length) bits.push(a.skipped.length + ' not counted');
  if (open) bits.push(open + ' needs an account');
  if (!bits.length) return { icon: ICON.none, color: '#8e8e93', sub: a.kind === 'not_financial' ? 'Not a bill or balance' : 'Nothing saved' };
  return { icon: open || a.skipped.length ? ICON.warn : ICON.ok, color: open || a.skipped.length ? 'var(--orange)' : 'var(--green)', sub: bits.join(' · ') };
}

function activity() {
  const list = S.activity;
  if (!list) return '<div class="title-row"><h1 class="large-title">Activity</h1></div><p class="status">Loading…</p>';
  return `<div class="title-row"><h1 class="large-title">Activity</h1></div>
    <div class="subtitle">Every screenshot you sent, and what happened to it</div>
    ${list.length ? `<div class="section"><div class="group">${list.map(a => { const i = activityInfo(a); return `<div class="cell tap" data-act="shot" data-id="${a.id}">
      <div class="icon" style="background:${i.color}">${i.icon}</div>
      <div class="main"><div class="t">${esc((a.notification || '').split('\n')[0] || a.kind)}</div><div class="s">${when(a.at)} · ${esc(i.sub)}</div></div><span class="chev">›</span></div>`; }).join('')}</div></div>
      <div class="footnote">Screenshots are kept privately for 30 days so you can check what was read.</div>`
      : '<div class="empty">No screenshots yet. Double-tap the back of your iPhone on a receipt or balance screen.</div>'}`;
}

// ---------- Sheets ----------

function sheet(title, body, right) {
  document.getElementById('sheet').innerHTML = `<div class="sheet-bar"><button data-act="close">${right ? 'Cancel' : 'Done'}</button><div class="ttl">${esc(title)}</div>${right ? `<button class="r" data-act="${right.act}" data-id="${esc(right.id || '')}">${esc(right.label)}</button>` : '<span></span>'}</div>${body}`;
  document.getElementById('sheetBg').style.display = 'flex';
  document.getElementById('sheet').scrollTop = 0;
}
function closeSheet() { document.getElementById('sheetBg').style.display = 'none'; }

function findTx(id) { for (const g of S.data.days) for (const t of g.txs) if (t.id === id) return { ...t, day: g.label }; return null; }

function editSheet(id) {
  const t = findTx(id), d = S.data;
  if (!t) return;
  const opt = (list, cur) => list.map(v => `<option value="${esc(v)}" ${v === cur ? 'selected' : ''}>${esc(v || '—')}</option>`).join('');
  sheet('Transaction', `
    <div class="section" style="margin-top:6px"><div class="group">
      <div class="cell"><div class="main"><div class="t">${esc(t.merchant || t.category)}</div><div class="s">${esc(t.day)} · ${esc(t.time)}</div></div></div>
      <label class="cell field"><span>Amount</span><input id="eAmount" type="number" inputmode="numeric" min="0" value="${t.amount}"></label>
      <label class="cell field"><span>Type</span><select id="eDir">${opt(['out', 'in', 'transfer'], t.direction)}</select></label>
      <label class="cell field"><span>Category</span><select id="eCat">${opt(d.categories, t.category)}</select></label>
      <label class="cell field"><span>Account</span><select id="eAcc">${opt(d.accountsList.concat(['Unknown']), t.account)}</select></label>
      <label class="cell field"><span>To Account</span><select id="eTo">${opt([''].concat(d.accountsList), t.to)}</select></label>
      <label class="cell field"><span>Status</span><select id="eStatus">${opt(['ok', 'check', 'duplicate?', 'ignore'], t.status)}</select></label>
    </div>
    <div class="footnote">${t.note ? esc(t.note) + ' ' : ''}"ok" and "check" count toward balances. "duplicate?" and "ignore" don't.</div>
    <div class="err" id="eErr"></div></div>`, { label: 'Save', act: 'save', id });
}

async function saveTx(id) {
  const v = k => document.getElementById(k).value, err = m => { document.getElementById('eErr').textContent = m; };
  const amount = Number(v('eAmount'));
  if (!Number.isFinite(amount) || amount < 0) return err('Enter an amount of 0 or more.');
  if (v('eDir') === 'transfer' && !v('eTo')) return err('Choose the account the money went to.');
  try {
    await api('POST', { action: 'update_tx', id, patch: { amount, direction: v('eDir'), category: v('eCat'), account: v('eAcc'), to_account: v('eDir') === 'transfer' ? v('eTo') : '', status: v('eStatus') } });
    closeSheet(); load();
  } catch (e) { err(e.message); }
}

function planSheet() {
  const d = S.data, b = d.budgets, m = d.reports.monthly;
  const items = d.categories.filter(c => !['Income', 'Transfer'].includes(c)).map(cat => {
    const r = b.rows.find(x => x.category === cat) || {};
    return { cat, amount: r.limit || 0, spent: r.spent || 0, reason: r.reason || '' };
  });
  items.push({ cat: 'Emergency fund', amount: b.emergency ? b.emergency.amount : 0, spent: 0, reason: b.emergency ? b.emergency.reason : '' });
  sheet(b.state === 'proposed' ? 'Proposed Budget' : 'Budget', `
    <div class="footnote" style="padding:2px 32px 0">${esc(d.cycle.label)}${m && m.emergency_fund && m.emergency_fund.target_amount ? ' · Emergency fund target ' + rp(m.emergency_fund.target_amount) : ''}</div>
    <div class="section" style="margin-top:12px"><div class="group">${items.map(i => `<label class="cell field" style="align-items:flex-start">
      <div class="main"><div>${esc(i.cat)}</div><div class="s wrap">${[i.spent ? 'Spent ' + rp(i.spent) : '', esc(i.reason)].filter(Boolean).join(' · ')}</div></div>
      <input type="number" inputmode="numeric" min="0" step="1000" data-cat="${esc(i.cat)}" value="${i.amount || ''}" placeholder="0" style="max-width:120px;padding-top:1px"></label>`).join('')}</div>
    <div class="err" id="pErr"></div>
    <button class="btn" data-act="approve" style="margin-top:6px">Approve Budget</button></div>`, { label: 'Approve', act: 'approve' });
}

async function approve() {
  const items = [...document.querySelectorAll('input[data-cat]')].map(i => ({ category: i.dataset.cat, amount: Math.round(Number(i.value) || 0) }));
  const err = m => { document.getElementById('pErr').textContent = m; };
  if (items.some(i => i.amount < 0)) return err('Amounts must be 0 or more.');
  if (!items.some(i => i.amount > 0)) return err('Enter at least one amount.');
  try { await api('POST', { action: 'approve_budgets', cycle_start: S.data.cycle.start, items }); closeSheet(); load(); }
  catch (e) { err(e.message); }
}

function reportSheet(kind) {
  const r = S.data.reports[kind];
  if (!r || r.pending || r.error) return;
  const list = (title, arr) => arr && arr.length ? `<div class="section"><div class="header"><span>${title}</span></div><div class="group">${arr.map(x => `<div class="cell"><div class="main wrap">${esc(x)}</div></div>`).join('')}</div></div>` : '';
  const ef = r.emergency_fund;
  sheet(kind === 'monthly' ? 'Pay-Cycle Report' : 'Weekly Check-In', `
    <div class="section" style="margin-top:6px"><div class="group"><div class="cell"><div class="main"><div class="wrap" style="font-weight:600">${esc(r.title)}</div>
      <div class="wrap" style="margin-top:6px">${esc(r.summary)}</div></div></div></div></div>
    ${list('What happened', r.highlights)}${list('What to do', r.actions)}
    ${ef && ef.target_amount ? `<div class="section"><div class="header"><span>Emergency fund</span></div><div class="group"><div class="cell"><div class="main"><div class="field"><span>Target</span><span class="num d">${rp(ef.target_amount)}</span></div><div class="s wrap">${esc(ef.reason)}</div></div></div></div></div>` : ''}
    <div class="section"><div class="group"><div class="cell tap" data-act="ask" data-id="${kind}"><div class="main link">Ask the CFO Again</div></div></div>
    <div class="footnote">Written ${when(r.created_at)}.</div></div>`);
}

function shotSheet(id) {
  const a = (S.activity || []).find(x => x.id === id);
  if (!a) return;
  const accounts = S.data ? S.data.accountsList : [];
  sheet('Screenshot', `
    <div class="section" style="margin-top:6px"><div class="header"><span>Notification</span><span>${when(a.at)}</span></div>
      <div class="group"><div class="cell"><div class="main wrap" style="white-space:pre-line">${esc(a.notification || a.error || '—')}</div></div></div></div>
    ${a.saved.length ? `<div class="section"><div class="header"><span>Saved</span></div><div class="group">${a.saved.map(t => txRow(t, (t.direction === 'transfer' ? t.account + ' → ' + t.to : t.category + ' · ' + t.account) + ' · ' + t.date + (t.time ? ' ' + t.time : ''))).join('')}</div></div>` : ''}
    ${a.balances.length ? `<div class="section"><div class="header"><span>Balances</span></div><div class="group">${a.balances.map(x => `<div class="cell"><div class="main">${esc(x.account)}</div><span class="num">${rp(x.balance)}</span></div>`).join('')}</div></div>` : ''}
    ${(a.unassigned || []).length ? `<div class="section"><div class="header"><span>Needs an account</span></div><div class="group">${a.unassigned.map((u, i) => u.assigned
      ? `<div class="cell"><div class="main num">${rp(u.balance_idr)}</div><span class="d">${u.assigned === 'ignore' ? 'Ignored' : 'Saved to ' + esc(u.assigned)}</span></div>`
      : `<label class="cell field"><span class="num">${rp(u.balance_idr)}</span><select data-assign="${i}" data-shot="${a.id}"><option value="">Choose account</option>${accounts.map(n => `<option>${esc(n)}</option>`).join('')}<option value="ignore">Ignore</option></select></label>`).join('')}</div>
      <div class="footnote">A balance Claude couldn't match to an account. Choose one to save it.</div></div>` : ''}
    ${a.skipped.length ? `<div class="section"><div class="header"><span>Not counted</span></div><div class="group">${a.skipped.map(x => `<div class="cell"><div class="main"><div class="wrap">${esc(x.text)}</div><div class="s wrap">${esc(x.reason)}</div></div></div>`).join('')}</div></div>` : ''}
    ${a.note ? `<div class="section"><div class="header"><span>Claude's note</span></div><div class="group"><div class="cell"><div class="main wrap">${esc(a.note)}</div></div></div></div>` : ''}
    ${a.hasImage ? `<div class="section"><div class="group"><div class="cell tap" data-act="image" data-id="${a.id}"><div class="main link">Show Screenshot</div></div></div><div id="img-${a.id}" style="margin-top:10px"></div></div>` : ''}
    <div class="footnote" style="padding:12px 32px 0">${a.cost ? 'Reading cost $' + a.cost.toFixed(4) + '. ' : ''}${a.status === 'duplicate' ? 'This exact image was sent before, so it was not read again and cost nothing.' : ''}</div>`);
}

async function showImage(id) {
  const box = document.getElementById('img-' + id);
  box.innerHTML = '<p class="status">Loading…</p>';
  try { const { url } = await api('GET', null, '?image=' + encodeURIComponent(id)); box.innerHTML = `<img class="shot" src="${esc(url)}" alt="Screenshot">`; }
  catch (e) { box.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

async function assign(sel) {
  if (!sel.value) return;
  try {
    await api('POST', { action: 'assign_balance', screenshot_id: sel.dataset.shot, index: Number(sel.dataset.assign), account: sel.value });
    const a = await api('GET', null, '?view=activity'); S.activity = a; store.set('money:activity', a);
    shotSheet(sel.dataset.shot); load();
  } catch (e) { alert(e.message); sel.value = ''; }
}

// ---------- Render and events ----------

function render() {
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  const d = S.data;
  if (!d) return;
  const body = S.tab === 'transactions' ? transactions(d) : S.tab === 'activity' ? activity() : summary(d);
  document.getElementById('app').innerHTML = `<div class="screen">${body}<p class="status" id="status"></p></div>`;
  status();
}

async function ask(kind) {
  try { await api('POST', { action: 'generate', kind }); closeSheet(); load(); }
  catch (e) { S.error = e.message; status(); }
}

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { S.tab = tab.dataset.tab; store.set('money:tab', S.tab); window.scrollTo(0, 0); render(); if (S.tab === 'activity') load(); return; }
  if (e.target.id === 'sheetBg') return closeSheet();
  const el = e.target.closest('[data-act]');
  if (!el || !el.dataset.act) return;
  const id = el.dataset.id;
  switch (el.dataset.act) {
    case 'edit': editSheet(id); break;
    case 'save': saveTx(id); break;
    case 'close': closeSheet(); break;
    case 'plan': planSheet(); break;
    case 'approve': approve(); break;
    case 'report': reportSheet(id); break;
    case 'ask': ask(id); break;
    case 'shot': shotSheet(id); break;
    case 'image': showImage(id); break;
    case 'filter': S.filter = id; render(); break;
    case 'cat': S.tab = 'transactions'; S.filter = 'all'; store.set('money:tab', S.tab); window.scrollTo(0, 0); render(); break;
    case 'prev': S.cycle = S.data.cycle.prevStart; load(); break;
    case 'next': { const cur = S.data.cycle.nextStart; S.cycle = S.data.cycle.isCurrent ? null : cur; load(); break; }
    case 'copy': navigator.clipboard.writeText(INGEST).then(() => { el.querySelector('.main').textContent = 'Copied'; }, () => { el.querySelector('.main').textContent = INGEST; }); break;
  }
});
document.addEventListener('change', e => { if (e.target.dataset.assign !== undefined) assign(e.target); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(); });
window.addEventListener('pageshow', e => { if (e.persisted) load(); });

render();
load();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
