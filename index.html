    <div class="main tap" data-act="edit" data-id="${x.id}"><div class="t ${on ? 'muted' : ''}">${esc(x.merchant || 'Medis')}</div><div class="s">${esc(x.date ? tgl(x.date) : x.label)} · ${esc(x.account)}</div></div><span class="num ${on ? 'muted' : ''}" style="margin-right:4px">${rs(x.amount)}</span>${stp(on ? ['aman', 'LUNAS'] : ['or', 'TAGIH'])}</div>`;
  const piutang = c.todo.length || c.done.length ? `<div class="section" id="claims"><div class="header"><span>Piutang kantor</span><span>${c.todo.length ? rs(c.total) + ' belum ditagih' : 'semua sudah ditagih'}</span></div><div class="group">
    ${c.todo.map(x => crow(x, false)).join('')}${c.done.slice(0, 3).map(x => crow(x, true)).join('')}</div><div class="footnote">Tagihan klinik dan rumah sakit yang kamu bayar sendiri. Centang ○ setelah diklaim.</div></div>` : '';
  const tools = toolsSection(d), rdn = nw.accounts.find(a => a.kind === 'investment');
  // Coming later: the real value of the investments (market value, profit and loss). Until then only the RDN cash is known.
  const aset = `<div class="section" id="aset"><div class="header"><span>Nilai aset investasi</span>${stp(['or', 'SOON!'])}</div><div class="group">
    ${rdn ? `<div class="srow"><div class="main"><div class="t">Kas di RDN</div><div class="s">${rdn.hasSnapshot ? esc(ago(rdn.asOf)) + ' · dari screenshot saldo' : 'belum ada saldo'}</div></div><span class="num">${rdn.hasSnapshot ? rs(rdn.balance) : '—'}</span></div>` : ''}
    ${['Nilai pasar saham', 'Untung/rugi (PnL)', 'Total aset sebenarnya'].map(x => `<div class="srow"><div class="main"><div class="t muted">${x}</div></div><span class="muted">segera</span></div>`).join('')}
  </div><div class="footnote">Nanti: nilai saham hari ini, untung/rugi, dan total aset yang sebenarnya.</div></div>`;
  if (isWide()) return `${head}<div class="dash"><div class="dash-cell span-7">${accounts}</div><div class="dash-cell span-5">${bagi}${aset}${gajian}${piutang}</div><div class="dash-cell span-12">${tools}</div></div>`;
  return `${head}${bagi}${accounts}${aset}${gajian}${piutang}${tools}`;
}

// ---------- Tambal amplop: cover an envelope that went over with money from envelopes that still have room ----------

/** Everyday envelopes that went over this cycle, worst first (only once the budget is approved). */
function jebolRows(d) {
  if (!d.cycle.isCurrent || d.budgets.state !== 'approved') return [];
  return d.budgets.rows.filter(r => !r.reserve && r.limit > 0 && r.spent > r.limit && !FIXED_CATS.includes(r.category)).sort((a, b) => (b.spent - b.limit) - (a.spent - a.limit));
}
/** Envelopes that can give: everyday ones with room left, most room first. */
function tambalDonors(d, cat) {
  return d.budgets.rows.filter(r => !r.reserve && r.limit > r.spent && !FIXED_CATS.includes(r.category) && r.category !== cat)
    .map(r => ({ cat: r.category, room: r.limit - r.spent, limit: r.limit, spent: r.spent, reason: r.reason || '' })).sort((a, b) => b.room - a.room);
}
/** A first suggestion: 'rata' takes from each in proportion to its room, 'longgar' empties the roomiest first. Amounts in whole thousands. */
function tambalPlan(donors, over, mode) {
  const roomSum = donors.reduce((a, x) => a + x.room, 0), need = Math.min(over, roomSum), take = {};
  donors.forEach(x => { take[x.cat] = 0; });
  if (mode === 'longgar') { let rest = need; for (const x of donors) { const t = Math.min(x.room, rest); take[x.cat] = t; rest -= t; } return take; }
  let given = 0;
  for (const x of donors) { take[x.cat] = Math.min(x.room, Math.floor(need * x.room / Math.max(1, roomSum) / 1000) * 1000); given += take[x.cat]; }
  for (const x of donors) { if (given >= need) break; const t = Math.min(x.room - take[x.cat], need - given); take[x.cat] += t; given += t; }
  return take;
}

function tambalSheet(cat) {
  const d = S.data, row = d.budgets.rows.find(r => r.category === cat);
  if (!row || row.spent <= row.limit) return;
  const over = row.spent - row.limit, donors = tambalDonors(d, cat), mode = S.tambalMode || 'rata', take = tambalPlan(donors, over, mode);
  S.tambal = { cat, over, donors };
  const body = donors.length ? `
    <div class="paper-slot" style="margin-top:6px"><div class="struk">
      <div class="sh"><div class="shop">TAMBAL AMPLOP</div><div class="sd">${esc(catName(cat))} · ${rs(row.spent)} dari ${rs(row.limit)}</div><div class="stamp-row">${stp(['jebol', 'JEBOL'])}</div></div>
      <div class="cut"></div>
      <p style="margin:0;font-size:17px;line-height:1.35">Uang ${rs(over)} itu sudah keluar. Pilih amplop yang dikurangi, supaya sisa di amplop lain tidak terlihat lebih aman dari kenyataan.</p>
      <div class="cut"></div><div class="tot big"><span>Perlu ditambal</span><span>${dots(over)}</span></div>
    </div></div>
    ${seg('tambalMode', mode, [['rata', 'Bagi rata'], ['longgar', 'Yang paling longgar dulu']])}
    <div class="section"><div class="header"><span>Ambil dari</span><span>ketik sendiri juga bisa</span></div><div class="group">
      ${donors.map(x => `<label class="cell field" style="align-items:flex-start"><div class="main"><div class="t">${esc(catName(x.cat))}</div><div class="s" id="tb-${esc(x.cat)}">sisa ${rs(x.room)} → ${rs(x.room - take[x.cat])}</div></div>
        <input inputmode="numeric" data-money data-tambal="${esc(x.cat)}" value="${take[x.cat] ? dots(take[x.cat]) : ''}" placeholder="0" style="width:120px"></label>`).join('')}
    </div></div>
    <div class="section"><div class="group"><div class="cell"><div class="main"><div class="t" id="tbTotal"></div><div class="s" id="tbNote"></div></div></div></div>
      <div class="err" id="tbErr"></div><button class="btn" data-act="tambalSave" data-id="${esc(cat)}" style="margin-top:6px">Tambal sekarang</button>
      <div class="footnote">Sisa sampai gajian tidak berubah: uangnya hanya pindah amplop. Bisa dibatalkan setelahnya.</div></div>`
    : `<div class="section"><div class="group"><div class="cell"><div class="main wrap">Tidak ada amplop harian yang masih punya sisa. ${esc(catName(cat))} lewat ${rs(over)}, dan itu sudah mengurangi sisa sampai gajian.</div></div></div></div>`;
  sheet('Tambal ' + catName(cat), body);
  updateTambal();
}

function tambalInputs() { return [...document.querySelectorAll('input[data-tambal]')].map(i => ({ el: i, cat: i.dataset.tambal, v: moneyValue(i) })); }
function updateTambal() {
  const t = S.tambal, total = document.getElementById('tbTotal');
  if (!t || !total) return;
  const rows = tambalInputs(), sum = rows.reduce((a, x) => a + x.v, 0);
  rows.forEach(x => { const dn = t.donors.find(y => y.cat === x.cat), el = document.getElementById('tb-' + x.cat); if (el && dn) { el.innerHTML = x.v > dn.room ? `<span class="red">lebih dari sisanya (${rs(dn.room)})</span>` : `sisa ${rs(dn.room)} → ${rs(dn.room - x.v)}`; } });
  total.textContent = 'Ditambal ' + rs(sum) + ' dari ' + rs(t.over);
  document.getElementById('tbNote').innerHTML = sum === t.over ? `<span class="green">Pas. ${esc(catName(t.cat))} tertutup.</span>` : sum > t.over ? `<span class="red">Kelebihan ${rs(sum - t.over)}</span>` : `Masih kurang ${rs(t.over - sum)}${sum ? ' · boleh, sisanya tetap jebol' : ''}`;
}

async function tambalSave(cat) {
  const d = S.data, t = S.tambal, err = m => { document.getElementById('tbErr').textContent = m; };
  if (!t || t.cat !== cat) return;
  const rows = tambalInputs().filter(x => x.v > 0), sum = rows.reduce((a, x) => a + x.v, 0);
  if (!sum) return err('Isi minimal satu amplop.');
  if (sum > t.over) return err(`Kelebihan ${rs(sum - t.over)}. Tambal secukupnya saja.`);
  const bad = rows.find(x => x.v > t.donors.find(y => y.cat === x.cat).room);
  if (bad) return err(`${catName(bad.cat)} cuma punya sisa ${rs(t.donors.find(y => y.cat === bad.cat).room)}.`);
  const row = d.budgets.rows.find(r => r.category === cat), day = tgl(todayKey(d)).slice(5);
  const items = [{ category: cat, amount: row.limit + sum, reason: `Ditambal ${rs(sum)} dari ${rows.map(x => catName(x.cat)).join(', ')} (${day})` }]
    .concat(rows.map(x => { const dn = t.donors.find(y => y.cat === x.cat); return { category: x.cat, amount: dn.limit - x.v, reason: `Dipakai ${rs(x.v)} untuk tambal ${catName(cat)} (${day})` }; }));
  const before = [{ category: cat, amount: row.limit, reason: row.reason || '' }].concat(rows.map(x => { const dn = t.donors.find(y => y.cat === x.cat); return { category: x.cat, amount: dn.limit, reason: dn.reason }; }));
  try {
    await api('POST', { action: 'approve_budgets', cycle_start: d.cycle.start, items });
    closeSheet(); load();
    toast(catName(cat) + ' ditambal ' + rs(sum), () => api('POST', { action: 'approve_budgets', cycle_start: d.cycle.start, items: before }));
  } catch (e) { err(e.message); }
}

// ---------- Spending ----------

function txRow(t, sub, act) {
  const color = t.direction === 'in' ? 'green' : t.direction === 'transfer' ? 'muted' : '';
  const amount = (t.direction === 'in' ? '+' : t.direction === 'out' ? '−' : '') + rs(t.amount);
  const chip = t.status === 'check' && !t.reviewed ? '<span class="chip">cek</span>'
    : t.spending && t.claim === 'todo' ? '<span class="chip blue">perlu klaim</span>' : '';
  return `<div class="cell ${act ? 'tap' : ''}" data-act="${act || ''}" data-id="${t.id}">${acct(t.direction === 'in' && t.to ? t.to : t.account, true)}<div class="main">
    <div class="t">${esc(t.merchant || t.category)}${chip}</div><div class="s">${esc(sub)}</div></div>
    <span class="num ${color}">${amount}</span></div>`;
}
/** Account badges: the real logos (public-domain SVGs from Wikimedia Commons) on a white tile; a drawn icon for Cash. */
const LOGO = { Mandiri: 'mandiri', 'Dana Darurat': 'mandiri', Jago: 'jago', RDN: 'jago', GoPay: 'gopay', OVO: 'ovo', DANA: 'dana' };
function acct(name, small) {
  const file = LOGO[name];
  if (file) return `<div class="acct ${small ? 'sm' : ''}" aria-label="${esc(name)}"><img src="logos/${file}.svg" alt=""></div>`;
  if (name === 'Cash') return `<div class="acct ${small ? 'sm' : ''}" style="background:#2e7d32" aria-label="Cash"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="11" rx="2" fill="none" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12.5" r="2.5" fill="#fff"/></svg></div>`;
  return `<div class="acct ${small ? 'sm' : ''}" style="background:#636366" aria-label="${esc(name)}">${esc(String(name || '?').slice(0, 2).toUpperCase())}</div>`;
}
const txSub = t => t.direction === 'transfer' ? t.account + ' → ' + t.to : catName(t.category) + ' · ' + t.account;

/** The days the Spending tab looks at: the last 7 or 14 days, or the whole pay cycle (payday to payday). */
function rangeOf(d) {
  const today = d.cycle.isCurrent ? todayKey(d) : d.daily[d.daily.length - 1].date;
  const upto = d.daily.filter(x => x.date <= today);
  const days = S.range === 'cycle' ? upto : upto.slice(-Number(S.range));
  const label = S.range === 'cycle' ? 'siklus ini' : `${S.range} hari terakhir`;
  return { days, from: days.length ? days[0].date : today, to: today, label };
}
const flexOf = x => x.amount - (x.fixed || 0) - (x.other || 0); // everyday spending: no fixed bills, no urgent reserve

const seg = (act, value, items, small) => `<div class="seg ${small ? 'small' : ''}">${items.map(([v, label]) => `<button data-act="${act}" data-id="${v}" class="${v === value ? 'on' : ''}">${label}</button>`).join('')}</div>`;

/** One category in the chosen range: what it cost, the range's share of its cycle budget, and the stamp that follows.
 *  Everyday categories are judged by pace (share = budget × days in range / days in cycle); fixed bills (Family, Bills) by the whole cycle. */
function rangeVerdict(d, cat) {
  const r = rangeOf(d), N = Math.max(1, (d.daily || []).length), n = r.days.length || 1;
  const row = d.budgets.rows.find(x => x.category === cat) || { category: cat, limit: 0, spent: 0 };
  const txs = [];
  for (const g of d.days) if (g.date >= r.from && g.date <= r.to) for (const t of g.txs)
    if (t.category === cat && t.spending && !t.fixed) txs.push({ ...t, day: g.label, date: g.date });
  const spent = txs.reduce((a, t) => a + t.amount, 0), limit = row.limit, share = limit * n / N;
  const fixed = FIXED_CATS.includes(cat), whole = S.range === 'cycle';
  let stamp, reason;
  if (!limit) { stamp = ['abu', 'BEBAS']; reason = 'Kategori ini tidak punya amplop, jadi tidak dinilai.'; }
  else if (fixed) {
    stamp = catStamp(d, row);
    reason = `Tagihan tetap dinilai per siklus, bukan per hari: ${rs(row.spent)} dari ${rs(limit)} siklus ini.`;
  } else if (whole && row.spent > limit) { stamp = ['jebol', 'JEBOL']; reason = `Siklus ini sudah ${rs(row.spent)}, lewat ${rs(row.spent - limit)} dari amplop ${rs(limit)}.`; }
  else {
    const p = spent / Math.max(1, share);
    stamp = p > 1 ? ['jebol', 'JEBOL'] : p >= 0.8 ? ['mepet', 'MEPET'] : ['aman', 'AMAN'];
    reason = p > 1 ? `Lewat ${rs(spent - share)} dari jatah ${r.label}.`
      : p >= 0.8 ? `Tinggal ${rs(share - spent)} dari jatah ${r.label}. Pelan-pelan.`
      : `Masih sisa ${rs(share - spent)} dari jatah ${r.label}.`;
  }
  return { r, cat, row, txs, spent, limit, share, n, N, fixed, stamp, reason, pct: share ? Math.round(spent / share * 100) : 0 };
}

/** Why a nota row got its stamp: the sum, the pace, where the cycle stands, and the payments in the range. */
function rangeCatSheet(cat) {
  const d = S.data, v = rangeVerdict(d, cat), rr = v.row, left = d.cycle.daysLeft;
  const math = !v.limit ? '' : v.fixed ? `<div class="tot"><span>Amplop siklus</span><span>${dots(v.limit)}</span></div><div class="tot"><span>Terpakai siklus ini</span><span>${dots(rr.spent)}</span></div>`
    : `<div class="tot"><span>Amplop satu siklus</span><span>${dots(v.limit)}</span></div>
       <div class="tot" style="color:var(--paper-muted)"><span>× ${v.n} dari ${v.N} hari</span><span></span></div>
       <div class="tot"><span>Jatah ${esc(v.r.label)}</span><span>${dots(v.share)}</span></div>
       <div class="tot"><span>Terpakai</span><span>${dots(v.spent)}</span></div>
       <div class="tot big ${v.spent > v.share ? 'over' : ''}"><span>${v.spent > v.share ? 'Lewat' : 'Sisa'}</span><span>${dots(v.share - v.spent)}</span></div>`;
  const pace = v.limit && !v.fixed ? `<div class="sf" style="text-align:left">Rata-rata ${rs(v.spent / v.n)} sehari · jatahnya ${rs(v.limit / v.N)} sehari (${v.pct}% terpakai).<br>Aturan stempel: AMAN di bawah 80% · MEPET 80–100% · JEBOL lewat 100%.</div>` : '';
  const cycle = v.limit && !v.fixed && d.cycle.isCurrent ? `<div class="section"><div class="header"><span>Posisi satu siklus</span>${stp(catStamp(d, rr))}</div><div class="group"><div class="cell" style="display:block">
      <div class="field"><span>${rs(rr.spent)} dari ${rs(rr.limit)}</span><span class="num ${rr.spent > rr.limit ? 'red' : 'd'}">${rr.spent > rr.limit ? 'tekor ' + rs(rr.spent - rr.limit) : 'sisa ' + rs(rr.limit - rr.spent)}</span></div>${budgetBar(rr.spent, rr.limit)}
      <div class="s wrap">${rr.spent > rr.limit ? 'Amplopnya sudah jebol untuk siklus ini.' : `Sisa itu untuk ${left} hari lagi, sekitar ${rs((rr.limit - rr.spent) / Math.max(1, left))} sehari.`}</div></div></div></div>` : '';
  sheet('Kenapa ' + v.stamp[1].toLowerCase() + '?', `
    <div class="paper-slot" style="margin-top:6px"><div class="struk">
      <div class="sh"><div class="shop">${esc(catName(cat).toUpperCase())}</div><div class="sd">${esc(tgl(v.r.from))} – ${esc(tgl(v.r.to))} · ${v.txs.length} pembayaran</div><div class="stamp-row">${stp(v.stamp)}</div></div>
      <div class="cut"></div><p style="margin:0;font-size:17px;line-height:1.35">${esc(v.reason)}</p>
      ${math ? `<div class="cut"></div>${math}` : ''}${pace ? `<div class="cut"></div>${pace}` : ''}
    </div></div>
    ${cycle}
    <div class="section"><div class="header"><span>Pembayaran ${esc(v.r.label)}</span><span>${rs(v.spent)}</span></div><div class="group">
      ${v.txs.map(t => txRow(t, t.day + (t.time ? ' · ' + t.time : '') + ' · ' + t.account, 'edit')).join('') || '<div class="cell"><div class="main muted">Tidak ada</div></div>'}
    </div></div>
    <div class="section"><div class="group">${jebolRows(d).some(x => x.category === cat) ? `<div class="cell tap" data-act="tambal" data-id="${esc(cat)}"><div class="main link">Tambal ${esc(catName(cat))} dari amplop lain</div><span class="chev">›</span></div>` : ''}<div class="cell tap" data-act="cat" data-id="${esc(cat)}"><div class="main link">Detail ${esc(catName(cat))} satu siklus</div><span class="chev">›</span></div></div></div>`);
}

function transactions(d) {
  if (S.filter) return filteredList(d);
  const r = rangeOf(d);
  const txs = [];
  for (const g of d.days) if (g.date >= r.from && g.date <= r.to) for (const t of g.txs) txs.push({ ...t, day: g.label, date: g.date });
  const spent = r.days.reduce((a, x) => a + flexOf(x), 0), outside = r.days.reduce((a, x) => a + (x.fixed || 0) + (x.other || 0), 0);
  const fold = (key, title, right, body) => { const open = S.folds[key]; return `<div class="section"><div class="group"><div class="cell tap grp-h ${open ? 'open' : ''}" data-act="fold" data-id="${key}"><div class="main"><div class="t" style="font-weight:600">${title}</div></div><span class="num d">${right}</span><span class="chev">›</span></div></div>${open ? body : ''}</div>`; };
  // The nota: everyday spending per category in the range, each stamped against that range's share of its budget.
  const by = new Map();
  for (const t of txs) if (t.spending && !t.fixed && t.category !== 'Other' && t.category !== 'Medical') {
    const g = by.get(t.category) || { cat: t.category, v: 0, n: 0, places: {} };
    g.v += t.amount; g.n++; const k = (t.merchant || '').trim(); if (k) g.places[k] = (g.places[k] || 0) + t.amount; by.set(t.category, g);
  }
  const cats = [...by.values()].sort((a, b) => b.v - a.v);
  const verdict = new Map(cats.map(c => [c.cat, rangeVerdict(d, c.cat)]));
  const jebol = cats.filter(c => verdict.get(c.cat).stamp[1] === 'JEBOL').length;
  const nota = cats.length ? `<div class="paper-slot rise"><div class="struk"><div class="sh"><div class="shop">NOTA ${esc(r.label.toUpperCase())}</div><div class="sd">${esc(tgl(r.from))} – ${esc(tgl(r.to))} · ${txs.filter(t => t.spending).length} pembayaran</div></div><div class="cut"></div>
    ${cats.map(c => { const top = Object.entries(c.places).sort((a, b) => b[1] - a[1]).slice(0, 2).map(x => x[0]).join(', ');
      return `<div class="nrow" data-act="rangeCat" data-id="${esc(c.cat)}"><div class="top"><span>${esc(catName(c.cat))}</span>${stp(verdict.get(c.cat).stamp)}</div><div class="bot"><span>${esc(top)}${c.n > 1 ? ' · ' + c.n + '×' : ''}</span><span>${dots(c.v)}</span></div></div>`; }).join('')}
    <div class="cut"></div><div class="tot big"><span>TOTAL</span><span>${dots(spent)}</span></div>
    ${outside ? `<div class="tot" style="color:var(--paper-muted)"><span>Di luar nota: tagihan tetap, dana darurat</span><span>${dots(outside)}</span></div>` : ''}
    <div class="cut"></div><div class="sf">Stempel = dibanding jatah ${esc(r.label)}. Ketuk baris untuk tahu kenapa.</div></div></div>`
    : `<div class="section"><div class="group"><div class="cell"><div class="main muted">Belum ada belanja di ${esc(r.label)}. Mantap.</div></div></div></div>`;
  // Bocor halus: categories that already cost more than the whole of last cycle.
  const last = d.lastCycle || {};
  const bocor = d.cycle.isCurrent ? d.budgets.rows.filter(x => !x.reserve && last[x.category] && x.spent > last[x.category] && !FIXED_CATS.includes(x.category)).map(x => ({ cat: x.category, up: x.spent - last[x.category] })).sort((a, b) => b.up - a.up) : [];
  const bocorCard = d.cycle.isCurrent && Object.keys(last).length ? `<div class="section"><div class="header"><span>Bocor halus</span><span>vs siklus lalu</span></div><div class="group">
    ${bocor.length ? bocor.map(x => `<div class="srow tap" data-act="cat" data-id="${esc(x.cat)}"><div class="main"><div class="t">${esc(catName(x.cat))}</div><div class="s">sudah lewat total siklus lalu</div></div><span class="num orange">+${rs(x.up)}</span></div>`).join('')
      : '<div class="srow"><div class="main"><div class="t">Tidak ada yang bocor</div><div class="s">Semua kategori masih di bawah siklus lalu. Mantap.</div></div></div>'}</div></div>` : '';
  const head = pageHead(`Belanja harian · ${esc(r.label)}`, rs(spent), jebol ? `<span class="red">${jebol} amplop jebol</span> di nota ini` : cats.length ? 'Belum ada amplop yang jebol' : '');
  const ranges = seg('range', S.range, [['7', '7 hari'], ['14', '14 hari'], ['cycle', 'Satu siklus']]);
  const ignored = (d.ignored || []).length ? `<div class="section"><div class="group"><div class="cell tap" data-act="notCounted"><div class="main">Tidak dihitung</div><span class="num d">${d.ignored.length}</span><span class="chev">›</span></div></div></div>` : '';
  if (isWide()) return `<div class="title-row"><h1 class="large-title">Rekap</h1>${ranges}</div>${head}
    <div class="dash" style="margin-top:32px"><div class="dash-cell span-5">${nota}${weekCard(d)}</div><div class="dash-cell span-7">${chartCard(d, r, txs)}${bocorCard}</div>
    <div class="dash-cell span-12">${groupsCard(d, r, txs)}${ignored}</div></div>`;
  return `<div class="title-row"><h1 class="large-title">Rekap</h1></div>${ranges}<div style="height:18px"></div>${head}${nota}${bocorCard}
    ${fold('chart', 'Grafik', '', chartCard(d, r, txs))}
    ${fold('tx', 'Semua transaksi', String(txs.length), groupsCard(d, r, txs))}
    ${ignored}
    <div class="footnote" style="padding-top:12px">Ketuk apa saja untuk membetulkan. Transaksi ganda disembunyikan otomatis.</div>`;
}

/** The chart for the chosen range: over time (per day, or per week for a whole cycle) or by category. */
function chartCard(d, r, txs) {
  const flex = r.days.map(x => ({ ...x, v: flexOf(x) })), total = flex.reduce((s, x) => s + x.v, 0);
  const avg = total / (flex.length || 1), limit = todayInfo(d).limit || d.spend.perDay || 0;
  const today = todayKey(d), overDays = limit ? flex.filter(x => x.v > (limitFor(d, x.date) || limit)).length : 0;
  let chart;
  if (S.chartBy === 'category') {
    const by = {};
    for (const t of txs) if (t.spending && !t.fixed && t.category !== 'Other') by[t.category] = (by[t.category] || 0) + t.amount;
    const rows = Object.entries(by).sort((a, b) => b[1] - a[1]), sum = rows.reduce((s, x) => s + x[1], 0) || 1;
    chart = rows.length ? `<div style="display:grid;gap:12px">${rows.map(([cat, v]) => `<div class="tap" data-act="cat" data-id="${esc(cat)}">
      <div class="field"><span>${esc(catInfo(d, cat).icon || '')} ${esc(catName(cat))}</span><span class="num"><b style="font-weight:600">${rs(v)}</b> <span class="d">· ${Math.round(v / sum * 100)}%</span></span></div>
      <div class="hbar"><div style="width:${Math.max(2, v / rows[0][1] * 100)}%;background:${groupColor(catInfo(d, cat).group)}"></div></div></div>`).join('')}</div>`
      : '<div class="muted" style="padding:20px 0;text-align:center">Tidak ada belanja di rentang ini</div>';
  } else if (S.range === 'cycle') {
    // Every day of the cycle, payday to payday: what was spent, and for the days still to come their allowance (pale).
    // Amounts are written only where they matter (days over the limit, the biggest day, today) so 28 bars stay readable.
    const all = cycleDays(d), ti = all.findIndex(c => c.today);
    const spaced = (order, gap, max) => { const kept = []; for (const i of order) { if (kept.length >= max) break; if (kept.every(k => Math.abs(k - i) > gap)) kept.push(i); } return new Set(kept); };
    // Amounts: today first, then the biggest days over their limit, never two within 2 bars of each other.
    const vOrder = [ti].concat(all.map((c, i) => i).filter(i => i !== ti && !all[i].future && all[i].every > 0 && (all[i].limit ? all[i].every > all[i].limit : true)).sort((a, b) => all[b].every - all[a].every)).filter(i => i >= 0 && all[i].every > 0);
    const showV = spaced(vOrder, 1, 7);
    // Dates: today, the first and last day, then every 7th day, never two within 3 bars of each other.
    const lOrder = [ti, 0, all.length - 1].concat(all.map((c, i) => i).filter(i => i % 7 === 0)).filter(i => i >= 0);
    const showL = spaced(lOrder, 3, 8);
    chart = labeledBars(all.map((c, i) => {
      const t = dateOf(c.key);
      return { key: c.key, v: c.future ? c.limit : c.every, ghost: c.future, hl: c.today, lim: c.limit || 0, showV: showV.has(i),
        label: !showL.has(i) ? '' : c.today ? 'Hari ini' : t.getDate() + ' ' + BULAN[t.getMonth()] };
    }), 'var(--tint)', 0, '', true);
  } else {
    chart = labeledBars(flex.map(x => {
      const dt = new Date(x.date + 'T00:00:00');
      return { key: x.date, v: x.v, hl: x.date === today, lim: limitFor(d, x.date) || 0, label: x.date === today ? 'Hari ini' : S.range === '7' ? HARI[dt.getDay()] : String(dt.getDate()) };
    }), 'var(--tint)', limit, '');
  }
  const facts = S.chartBy === 'category' ? 'Bagian dari belanja harianmu. Ketuk kategori untuk detailnya'
    : `Sekitar ${rs(avg)} sehari${d.spend.perDay ? ` · batas ${rs(d.spend.perDay)}${d.spend.perWeekend && d.spend.perWeekend !== d.spend.perDay ? ' (' + rs(d.spend.perWeekend) + ' akhir pekan)' : ''}` : ''}${overDays ? ` · <span class="red">${overDays} hari lewat</span>` : ''}${S.range === 'cycle' ? ' · batang pucat = jatah hari yang belum lewat · angka dalam rb' : S.range === '14' ? ' · angka dalam rb' : ''} · ketuk batang untuk struknya`;
  return `<div class="section"><div class="group chart" style="padding:12px">
    ${seg('chartBy', S.chartBy, [['time', 'Per waktu'], ['category', 'Per kategori']], true)}
    ${chart}
  </div><div class="footnote">${facts}. Tagihan tetap dan biaya darurat tidak dihitung.</div></div>`;
}

/** Emergency fund and Investing as budget rows: planned amount, and for Investing how much was actually invested. */
function savingRows(d) {
  return (d.budgets.saving || []).map(r => `<div class="cell tap" data-act="${r.category === 'Investing' ? 'gotoSaving' : 'plan'}" style="align-items:flex-start">${emo(d, r.category)}<div class="main">
    <div class="field"><span class="t">${esc(catName(r.category))}</span><span class="num" style="font-size:15px">${r.spent >= r.limit ? '<span class="green">✓ Beres</span>' : budgetLeft(r.spent, r.limit).replace('sisa', 'kurang')}</span></div>
    ${budgetBar(Math.min(r.spent, r.limit), r.limit)}<div class="s num">${(r.category === 'Investing' ? 'Diinvestasikan ' : 'Dipindah ') + rs(r.spent) + ' dari ' + rs(r.limit)}</div></div><span class="chev">›</span></div>`).join('');
}

/** The cycle's plan, short: the total and the three categories closest to their budget; the rest on request. */
function planCard(d) {
  const rows = d.budgets.rows.filter(r => !r.reserve && r.category !== 'Family' && (r.limit > 0 || r.spent > 0))
    .sort((a, b) => (b.limit ? b.spent / b.limit : 9) - (a.limit ? a.spent / a.limit : 9));
  if (!rows.length) return '';
  const spent = rows.reduce((s, r) => s + r.spent, 0), limit = rows.reduce((s, r) => s + r.limit, 0), shown = S.planAll ? rows : rows.slice(0, 3);
  return `<div class="section"><div class="header"><span>Rencana siklus ini</span><span>${budgetLeft(spent, limit)}</span></div><div class="group">
    <div class="cell" style="display:block"><div class="field"><span class="num" style="font-weight:600">${rs(spent)}</span><span class="d num">dari ${rs(limit)}</span></div>${budgetBar(spent, limit)}</div>
    ${shown.map(r => `<div class="cell tap" data-act="cat" data-id="${esc(r.category)}" style="align-items:flex-start">${emo(d, r.category)}<div class="main">
      <div class="field"><span class="t">${esc(catName(r.category))}</span><span class="num" style="font-size:15px">${budgetLeft(r.spent, r.limit)}</span></div>
      ${budgetBar(r.spent, r.limit)}<div class="s num">${rs(r.spent)} dari ${r.limit ? rs(r.limit) : 'tanpa anggaran'}</div></div><span class="chev">›</span></div>`).join('')}
    ${rows.length > 3 ? `<div class="cell tap" data-act="planAll"><div class="main link">${S.planAll ? 'Lebih sedikit' : 'Semua ' + rows.length + ' kategori'}</div></div>` : ''}
    ${savingRows(d)}
  </div><div class="footnote">Garis putih = batas anggaran. Keluarga (tetap) dan dana darurat tidak masuk rencana.</div></div>`;
}

/** Transactions in the range, grouped by category, day or account. Groups stay closed until you open one. */
function groupsCard(d, r, txs) {
  if (!txs.length) return `<div class="empty">Belum ada di ${esc(r.label)}. Ketuk dua kali bagian belakang iPhone di struk.</div>`;
  const key = t => S.groupBy === 'day' ? t.date : S.groupBy === 'account' ? (t.direction === 'transfer' ? 'Antar rekening' : t.account) : t.category;
  const groups = new Map();
  for (const t of txs) {
    const k = key(t);
    if (!groups.has(k)) groups.set(k, { key: k, txs: [], spent: 0, label: S.groupBy === 'day' ? t.day : S.groupBy === 'category' ? catName(k) : k });
    const g = groups.get(k);
    g.txs.push(t);
    if (t.spending) g.spent += t.amount;
  }
  const list = [...groups.values()].sort((a, b) => S.groupBy === 'day' ? (a.key < b.key ? 1 : -1) : b.spent - a.spent || b.txs.length - a.txs.length);
  const icon = g => S.groupBy === 'category' ? emo(d, g.key) : S.groupBy === 'day' ? `<div class="emo" style="font-size:13px;font-weight:700">${esc(String(Number(g.key.slice(8, 10))))}</div>`
    : `<div class="emo" style="font-size:13px;font-weight:700">${esc(g.key.slice(0, 2))}</div>`;
  return `<div class="section"><div class="header"><span>Transaksi</span><span>${txs.length}</span></div>
    ${seg('groupBy', S.groupBy, [['category', 'Kategori'], ['day', 'Hari'], ['account', 'Rekening']], true)}
    <div class="group">${list.map(g => {
      const open = S.open === g.key, shown = g.txs.slice(0, 20);
      return `<div class="cell tap grp-h ${open ? 'open' : ''}" data-act="openGroup" data-id="${esc(g.key)}">${icon(g)}<div class="main">
          <div class="t">${esc(g.label)}</div><div class="s">${g.txs.length} transaksi</div></div>
          <span class="num">${g.spent ? rs(g.spent) : ''}</span><span class="chev">›</span></div>
        ${open ? `<div class="grp-body">${shown.map(t => txRow(t, (S.groupBy === 'day' ? txSub(t) : t.day + ' · ' + (S.groupBy === 'account' ? t.category : t.account)) + (t.time ? ' · ' + t.time : ''), 'edit')).join('')}
          ${g.txs.length > 20 ? `<div class="cell"><div class="main muted">+ ${g.txs.length - 20} lagi · pilih rentang lebih pendek</div></div>` : ''}</div>` : ''}`;
    }).join('')}</div></div>`;
}

/** The old flat list, for "Check N transactions" (review). */
function filteredList(d) {
  const keep = t => S.filter === 'review' ? t.status === 'check' && !t.reviewed : t.category === S.filter;
  const days = d.days.map(g => ({ ...g, txs: g.txs.filter(keep) })).filter(g => g.txs.length);
  return `<div class="title-row"><h1 class="large-title">${S.filter === 'review' ? 'Perlu dicek' : esc(catName(S.filter))}</h1><span class="pill tap" data-act="clearFilter">Selesai ✕</span></div>
    ${days.length ? days.map(g => `<div class="section"><div class="header"><span>${esc(g.label)}</span></div>
      <div class="group">${g.txs.map(t => txRow(t, txSub(t) + (t.time ? ' · ' + t.time : ''), 'edit')).join('')}</div></div>`).join('')
      : '<div class="empty">Tidak ada yang perlu dicek.</div>'}`;
}

/** Rows set to "don't count", so they can be brought back. */
function notCountedSheet() {
  const d = S.data;
  sheet('Tidak dihitung', `<div class="section" style="margin-top:6px"><div class="group">${(d.ignored || []).map(t => txRow(t, t.label + ' · ' + txSub(t), 'edit')).join('')}</div>
    <div class="footnote">Ini kamu set "jangan dihitung". Ketuk satu dan pilih "Hitung? Ya" untuk mengembalikan.</div></div>`);
}



/** The cycle in 7-day blocks with what was spent in each: [{label: '25 Sep', v, hl}]. */
function cycleWeeks(d, byDay) {
  const weeks = [], today = todayKey(d);
  for (let i = 0; i < d.daily.length; i += 7) {
    const days = d.daily.slice(i, i + 7);
    weeks.push({ label: shortDay(days[0].date), v: days.reduce((s, x) => s + (byDay[x.date] || 0), 0), hl: days.some(x => x.date === today) });
  }
  return weeks;
}

/** One category: spent vs budget, week by week, top places and every transaction. */
function catSheet(name) {
  const d = S.data, c = catInfo(d, name), row = d.budgets.rows.find(r => r.category === name) || { spent: 0, limit: 0 };
  const txs = [];
  for (const g of d.days) for (const t of g.txs) if (t.category === name) txs.push({ ...t, day: g.label, date: g.date });
  const spentTx = txs.filter(t => t.spending);
  const byDay = {}; for (const t of spentTx) byDay[t.date] = (byDay[t.date] || 0) + t.amount;
  const places = {}; for (const t of spentTx) { const k = (t.merchant || '—').trim(); places[k] = places[k] || { name: k, v: 0, n: 0 }; places[k].v += t.amount; places[k].n++; }
  const topPlaces = Object.values(places).sort((a, b) => b.v - a.v).slice(0, 5);
  const color = groupColor(c.group), spent = row.spent, limit = row.limit, paid = limit && fixedDone(d, name) && spent <= limit * 1.02;
  const last = (d.lastCycle || {})[name] || 0, diff = spent - last;

/** Each screenshot's stamp: TERBACA (saved), DOBEL (sent before), GAGAL (unreadable), RAGU (something still needs you), KOSONG, UJI. */
function activityInfo(a) {
  if (a.status === 'error') return { stamp: ['jebol', 'GAGAL'], sub: 'Tidak terbaca' };
  if (a.status === 'duplicate') return { stamp: ['abu', 'DOBEL'], sub: 'Sudah pernah dikirim · diabaikan' };
  if (a.status === 'dry_run') return { stamp: ['abu', 'UJI'], sub: 'Percobaan' };
  const saved = a.saved.filter(t => t.status !== 'duplicate?' && t.status !== 'replaced').length;
  const bits = [];
  if (saved) bits.push(saved + ' transaksi');
  if (a.balances.length) bits.push(a.balances.length + ' saldo');
  const open = (a.unassigned || []).some(u => !u.assigned) || (a.skipped || []).some(x => !x.resolved);
  if (open) return { stamp: ['mepet', 'RAGU'], sub: (bits.join(' · ') || 'Tidak ada yang disimpan') + ' · ada yang perlu dicek' };
  if (!bits.length) return { stamp: ['abu', 'KOSONG'], sub: a.kind === 'not_financial' ? 'Bukan tagihan atau saldo' : 'Tidak ada yang baru' };
  return { stamp: ['aman', 'TERBACA'], sub: bits.join(' · ') };
}

function findTx(id) {
  for (const g of S.data.days) for (const t of g.txs) if (t.id === id) return { ...t, day: g.label };

  const c = S.data.claims && S.data.claims.todo.concat(S.data.claims.done).find(x => x.id === id); // a bill from an earlier cycle

}

const moneyValue = el => Number(String(el.value).replace(/[^\d]/g, '')) || 0;
function formatMoneyInput(el) {
  const v = moneyValue(el);
  el.value = v ? String(v).replace(/\B(?=(\d{3})+(?!\d))/g, '.') : '';

async function saveTx(id) {
  const v = k => document.getElementById(k).value, err = m => { document.getElementById('eErr').textContent = m; };
  const amount = moneyValue(document.getElementById('eAmount'));
  if (!amount) return err('Isi jumlahnya.');
  if (v('eDir') === 'transfer' && !v('eTo')) return err('Pilih rekening tujuan uangnya.');
  try {
    const claim = document.getElementById('eClaim'), before = findTx(id);
    await api('POST', { action: 'update_tx', id, patch: { amount, direction: v('eDir'), category: v('eCat'), account: v('eAcc'), to_account: v('eDir') === 'transfer' ? v('eTo') : '', status: v('eStatus') === 'check' ? 'ok' : v('eStatus'), ...(claim ? { claim: claim.value || null } : {}) } });
    closeSheet(); load();
    if (v('eStatus') === 'ignore' && before && before.status !== 'ignore') {
      toast('Tidak dihitung', () => api('POST', { action: 'restore_tx', id, status: before.status, reviewed: before.reviewed }));
    } else toast('Tersimpan');
  } catch (e) { err(e.message); }
}

/** A short message at the bottom with an Undo button, for one-tap actions that are easy to hit by mistake. */
let toastTimer = null, toastUndo = null;
function toast(text, undo) {
  const box = document.getElementById('toast');
  document.getElementById('toastText').textContent = text;
  document.getElementById('toastUndo').hidden = !undo;
  toastUndo = undo || null;
  box.style.display = 'flex';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { box.style.display = 'none'; toastUndo = null; }, 7000);
}
document.getElementById('toastUndo').addEventListener('click', async () => {
  const undo = toastUndo;
  document.getElementById('toast').style.display = 'none'; toastUndo = null;
  if (undo) { try { await undo(); load(); } catch (e) { alert(e.message); } }
});

/** Shows a checkbox as ticked or not, and keeps its state on the element so the next tap does the opposite. */
function setCheck(el, on) {
  el.classList.toggle('on', on); el.innerHTML = on ? ICON.ok : ''; el.dataset.on = on ? '1' : '0';
  el.setAttribute('aria-label', on ? 'Sudah' : 'Tandai sudah');
}

async function setClaim(id, claim, el) {
  if (el.disabled) return;
  setCheck(el, claim === 'done'); el.disabled = true;
  try { await api('POST', { action: 'set_claim', id, claim }); }
  catch (e) { setCheck(el, claim !== 'done'); S.error = e.message; status(); }
  finally { el.disabled = false; load(); }
}

async function confirmTx(id) {

  } catch (e) { const el = document.getElementById('eErr'); if (el) el.textContent = e.message; }
}

/** "Rp30,1 jt of your Rp30,5 jt income · Rp400 rb not planned" — the budget can never be more than the income. */
function capLine(total) {
  const cap = S.data && S.data.budgets.cap;
  if (!cap) return 'direncanakan siklus ini';
  return total > cap ? `<span class="red">${rs(total - cap)} lebih dari pemasukan ${rs(cap)}</span> · kurangi dulu supaya bisa disetujui`
    : `dari pemasukan ${rs(cap)} · ${rs(cap - total)} belum direncanakan`;
}

async function approve() {
  const items = [...document.querySelectorAll('input[data-cat]')].map(i => ({ category: i.dataset.cat, amount: moneyValue(i) }));
  const err = m => { document.getElementById('pErr').textContent = m; };
  if (!items.some(i => i.amount > 0)) return err('Isi minimal satu jumlah.');
  const total = items.reduce((s, i) => s + i.amount, 0), cap = S.data.budgets.cap;
  if (cap && total > cap) return err(`Itu ${rs(total - cap)} lebih dari pemasukanmu. Kurangi dulu.`);
  try { await api('POST', { action: 'approve_budgets', cycle_start: S.data.cycle.start, items }); closeSheet(); load(); }
  catch (e) { err(e.message); }
}

  if (!a) return;
  const accounts = S.data ? S.data.accountsList : [];
  const saved = a.saved.filter(t => t.status !== 'duplicate?' && t.status !== 'replaced');
  const repeats = a.saved.length - saved.length;
  const left = (a.skipped || []).filter(x => !x.resolved);
  sheet('Screenshot', `
    ${saved.length ? `<div class="section" style="margin-top:6px"><div class="header"><span>Disimpan</span></div><div class="group">${saved.map(t => txRow(t, txSub(t) + ' · ' + t.date)).join('')}</div>
      ${repeats ? `<div class="footnote">${repeats} sudah tersimpan dari screenshot lain, jadi tidak dihitung dua kali.</div>` : ''}</div>`
      : `<div class="section" style="margin-top:6px"><div class="group"><div class="cell"><div class="main wrap">${esc(shorten(a.notification || a.error || 'Tidak ada yang disimpan'))}</div></div></div></div>`}
    ${a.balances.length ? `<div class="section"><div class="header"><span>Saldo</span></div><div class="group">${a.balances.map(x => `<div class="cell"><div class="main">${esc(x.account)}</div><span class="num">${rs(x.balance)}</span></div>`).join('')}</div></div>` : ''}
    ${(a.unassigned || []).length ? `<div class="section"><div class="header"><span>Ini rekening yang mana?</span></div><div class="group">${a.unassigned.map((u, i) => u.assigned
      ? `<div class="cell"><div class="main"><div class="num">${rs(u.balance_idr)}</div><div class="s">${u.assigned === 'ignore' ? 'Diabaikan' : 'Disimpan sebagai ' + esc(u.assigned)}</div></div><span class="link tap" data-act="unassign" data-id="${a.id}" data-i="${i}">Batalkan</span></div>`
      : `<label class="cell field"><span class="num">${rs(u.balance_idr)}</span><select data-assign="${i}" data-shot="${a.id}"><option value="">Pilih</option>${accounts.map(n => `<option>${esc(n)}</option>`).join('')}<option value="ignore">Abaikan</option></select></label>`).join('')}</div></div>` : ''}
    ${left.length ? `<div class="section"><div class="header"><span>Tidak dihitung</span></div><div class="group">${left.map(x => `<div class="cell"><div class="main"><div class="wrap">${esc(shorten(x.text))}</div><div class="s wrap">${esc(x.reason)}</div></div></div>`).join('')}</div></div>` : ''}
    ${a.hasImage ? `<div class="section"><div class="group"><div class="cell tap" data-act="image" data-id="${a.id}"><div class="main link">Lihat screenshot</div></div></div><div id="img-${a.id}" style="margin-top:10px"></div></div>` : ''}
    <div class="footnote" style="padding:12px 32px 0">${when(a.at)}${a.cost ? ' · biaya $' + a.cost.toFixed(4) : ''}</div>`);
}

async function showImage(id) {
  const box = document.getElementById('img-' + id);
  box.innerHTML = '<p class="status">Membuka…</p>';
  try { const { url } = await api('GET', null, '?image=' + encodeURIComponent(id)); box.innerHTML = `<img class="shot" src="${esc(url)}" alt="Screenshot">`; }
  catch (e) { box.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

async function unassign(shotId, index) {
  try {
    await api('POST', { action: 'unassign_balance', screenshot_id: shotId, index });
    const a = await api('GET', null, '?view=activity'); S.activity = a; store.set('money:activity', a);
    shotSheet(shotId); load();
  } catch (e) { alert(e.message); }
}

async function assign(sel) {
  if (!sel.value) return;
  try {
    await api('POST', { action: 'assign_balance', screenshot_id: sel.dataset.shot, index: Number(sel.dataset.assign), account: sel.value });
    const a = await api('GET', null, '?view=activity'); S.activity = a; store.set('money:activity', a);
    shotSheet(sel.dataset.shot); load();
  } catch (e) { alert(e.message); sel.value = ''; }
}

function copy(text, el, done) {
  navigator.clipboard.writeText(text).then(() => { el.textContent = done; }, () => { el.textContent = 'Tekan lama untuk menyalin'; });
}

// ---------- Render and events ----------

function render() {
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  const d = S.data;
  if (!d) return;
  const badge = document.getElementById('badge'), n = d.improve ? d.improve.items.length : 0;
  badge.hidden = !n; badge.textContent = n;
  if (S.tab === 'cfo' && !isWide()) S.tab = 'plan'; // on a phone the CFO meeting sits inside Amplop
  const body = S.tab === 'transactions' ? transactions(d) : S.tab === 'activity' ? activity(d)
    : S.tab === 'plan' ? planPage(d) : S.tab === 'money' ? moneyPage(d) : S.tab === 'cfo' ? cfoPage(d) : home(d);
  const app = document.getElementById("app"), same = app.dataset.shown === S.tab;
  app.dataset.shown = S.tab; app.classList.toggle('still', same);
  app.innerHTML = `<div class="screen">${body}<p class="status" id="status"></p></div>`;
  status();
}

/** Opens the page that holds a section (Amplop, Dompet, Rapat CFO), then scrolls to it. */
function openMoreAt(id) {
  const page = { cfo: isWide() ? 'cfo' : 'plan', pay: 'money', claims: 'money', saving: 'plan', money: 'money' }[id];
  if (page && S.tab !== page) goTab(page);
  const box = document.getElementById(id);
  if (box) box.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

const isWide = () => window.matchMedia('(min-width: 900px)').matches;
let resizeTimer = null;
window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 150); });

function goTab(tab) { S.tab = tab; store.set('money:tab', tab); window.scrollTo(0, 0); render(); if (tab === 'activity') load(); }

async function ask() {
  try { await api('POST', { action: 'generate' }); closeSheet(); await load(); openMoreAt('cfo'); }
  catch (e) { closeSheet(); S.error = e.message; status(); alert(e.message); }
}

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { S.filter = null; return goTab(tab.dataset.tab); }
  if (e.target.id === 'sheetBg') return closeSheet();
  const el = e.target.closest('[data-act]');
  if (!el || !el.dataset.act) return;
  const id = el.dataset.id;
  switch (el.dataset.act) {
    case 'edit': editSheet(id); break;
    case 'confirm': confirmTx(id); break;
    case 'save': saveTx(id); break;
    case 'close': closeSheet(); break;
    case 'plan': planSheet(); break;
    case 'approve': approve(); break;
    case 'report': reportSheet(id); break;
    case 'ask': {
      // Costs AI credit, so a mis-tap does nothing: the first tap asks to confirm, the second within 5 seconds asks the CFO.
      if (el.dataset.armed === '1') { ask(); break; }
      el.dataset.armed = '1';
      const label = el.querySelector('.link') || el;
      const before = label.textContent;
      label.textContent = 'Yakin? Ketuk lagi (sekitar $0,06)';
      setTimeout(() => { if (el.isConnected) { el.dataset.armed = ''; label.textContent = before; } }, 5000);
      break;
    }
    case 'unassign': unassign(id, Number(el.dataset.i)); break;
    case 'history': historySheet(); break;
    case 'todo': setTodo(id, Number(el.dataset.i), el.dataset.on !== '1', el); break;
    case 'gotoCfo': openMoreAt('cfo'); break;
    case 'gotoSaving': openMoreAt('saving'); break;
    case 'useSug': { const input = [...document.querySelectorAll('input[data-cat]')].find(x => x.dataset.cat === el.dataset.cat); if (input) { input.value = el.dataset.amount; formatMoneyInput(input); input.dispatchEvent(new Event('input', { bubbles: true })); } break; }
    case 'shot': shotSheet(id); break;
    case 'image': showImage(id); break;
    case 'more': S.showAll = !S.showAll; render(); break;
    case 'cat': catSheet(id); break;
    case 'rangeCat': rangeCatSheet(id); break;
    case 'tambal': tambalSheet(id); break;
    case 'dayStruk': S.day = id; sheet(tgl(id), `<div class="paper-slot" style="margin-top:6px">${strukHtml(S.data, false)}</div>`); break;
    case 'tambalMode': S.tambalMode = id; if (S.tambal) tambalSheet(S.tambal.cat); break;
    case 'tambalSave': tambalSave(id); break;
    case 'why': whySheet(); break;
    case 'toggleMore': S.more = !S.more; store.set('money:more', S.more); render(); break;
    case 'review': S.filter = 'review'; goTab('transactions'); break;
    case 'gotoImprove': goTab('activity'); break;
    case 'gotoPay': case 'gotoClaims': openMoreAt(el.dataset.act === 'gotoPay' ? 'pay' : 'claims'); break;
    case 'claim': setClaim(id, el.dataset.on === '1' ? 'todo' : 'done', el); break;
    case 'clearFilter': S.filter = null; render(); break;
    case 'range': S.range = id; S.open = null; store.set('money:range', id); render(); break;
    case 'chartBy': S.chartBy = id; store.set('money:chartBy', id); render(); break;
    case 'groupBy': S.groupBy = id; S.open = null; store.set('money:groupBy', id); render(); break;
    case 'openGroup': S.open = S.open === id ? null : id; render(); break;
    case 'planAll': S.planAll = !S.planAll; render(); break;
    case 'fold': S.folds[id] = !S.folds[id]; store.set('money:folds', S.folds); render(); break;
    case 'moneyView': S.moneyView = id; store.set('money:view', id); render(); break;
    case 'notCounted': notCountedSheet(); break;
    case 'prev': S.cycle = S.data.cycle.prevStart; load(); break;
    case 'current': S.cycle = null; load(); break;
    case 'copy': copy(INGEST, el.querySelector('.main'), 'Tersalin'); break;
    case 'copyImprove': copy(S.data.improve.report, el, 'Tersalin · sekarang tempel di Claude Code'); break;
  }
});
document.addEventListener('input', e => { if (e.target.dataset.money !== undefined) {
  formatMoneyInput(e.target);
  if (e.target.dataset.tambal !== undefined) updateTambal();
  const total = document.getElementById('planTotal');
  if (total) {
    const sum = [...document.querySelectorAll('input[data-cat]')].reduce((s, i) => s + moneyValue(i), 0);
    total.textContent = rs(sum); total.classList.toggle('red', !!(S.data.budgets.cap && sum > S.data.budgets.cap));
    document.getElementById('planCap').innerHTML = capLine(sum);
    document.querySelectorAll('[data-grp]').forEach(el => { const g = el.dataset.grp; el.textContent = rs([...document.querySelectorAll('input[data-cat]')].filter(i => (['Family', 'Bills', 'Emergency fund'].includes(i.dataset.cat) ? 'Fixed' : i.dataset.cat === 'Investing' ? 'Investing' : 'Adjustable') === g).reduce((s, i) => s + moneyValue(i), 0)); });
  }
} });
document.addEventListener('change', e => { if (e.target.dataset.assign !== undefined) assign(e.target); });
// The day strip: tap or drag a thumb along it, or use the arrow keys, to print that day's struk.
let stripDrag = false;
const dayAt = (e, strip) => { const r = strip.getBoundingClientRect(), el = document.elementFromPoint(Math.min(r.right - 1, Math.max(r.left + 1, e.clientX)), r.top + r.height / 2); return el && el.closest('.sday'); };
document.addEventListener('pointerdown', e => { const strip = e.target.closest('#strip'); if (!strip) return; stripDrag = true; const d = dayAt(e, strip); if (d) pickDay(d.dataset.day, 'tap'); });
document.addEventListener('pointermove', e => { if (!stripDrag) return; const strip = document.getElementById('strip'); if (!strip) return; const d = dayAt(e, strip); if (d) pickDay(d.dataset.day, 'drag'); });
document.addEventListener('pointerup', () => { stripDrag = false; });
document.addEventListener('pointercancel', () => { stripDrag = false; });
document.addEventListener('keydown', e => {
  if (!e.target.closest || !e.target.closest('#strip') || !['ArrowLeft', 'ArrowRight'].includes(e.key)) return;
  const days = cycleDays(S.data), i = days.findIndex(c => c.key === S.day), j = i + (e.key === 'ArrowRight' ? 1 : -1);
  if (days[j]) { e.preventDefault(); pickDay(days[j].key, 'key'); }
});
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(); });
window.addEventListener('pageshow', e => { if (e.persisted) load(); });

render();
load();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
