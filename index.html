<title>Money</title>
<style>
  /* iOS dark system colors (always dark, the owner's choice), grouped lists, one clear number per screen. */
  :root {
    color-scheme: dark;
    --bg: #000000; --cell: #1c1c1e; --label: #ffffff; --label2: rgba(235,235,245,.6); --label3: rgba(235,235,245,.3);

  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .screen { max-width: 600px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 10px) 0 calc(env(safe-area-inset-bottom) + 96px); }

  .next { display: flex; align-items: center; gap: 12px; padding: 15px 20px; background: var(--tint); color: #fff; border-radius: 999px; cursor: pointer; }
  .next .main div:last-child { opacity: .85; font-size: 15px; margin-top: 2px; }
  .next.done { background: var(--cell); color: var(--label); cursor: default; }
  .icon { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; color: #fff; font-weight: 700; font-size: 15px; }
  .icon svg { width: 18px; height: 18px; }
  .chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 6px; border-radius: 5px; margin-left: 6px; vertical-align: 2px; background: rgba(255,149,0,.18); color: var(--orange); }
  .empty { color: var(--label2); text-align: center; padding: 36px 24px; font-size: 15px; }
  .segment { display: flex; background: var(--fill); border-radius: 9px; padding: 2px; margin: 14px 16px 0; }
  .segment button { flex: 1; border: 0; background: none; padding: 7px 0; border-radius: 7px; font-size: 13px; font-weight: 600; }
  .segment button.on { background: var(--cell); box-shadow: 0 3px 8px rgba(0,0,0,.12), 0 3px 1px rgba(0,0,0,.04); }
  .status { text-align: center; color: var(--label2); font-size: 12px; margin-top: 16px; min-height: 15px; }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--sep); padding-bottom: env(safe-area-inset-bottom); }
  .tabbar .in { max-width: 600px; margin: 0 auto; display: flex; height: 49px; }
  .tabbar button { position: relative; flex: 1; border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; font-weight: 500; color: #999; }
  .tabbar button.on { color: var(--tint); }
  .tabbar svg { width: 25px; height: 25px; }
  .badge { position: absolute; top: 3px; left: 50%; margin-left: 6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff; font-size: 12px; font-weight: 600; line-height: 18px; }
  .sheet-bg { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.4); display: none; align-items: flex-end; justify-content: center; }
  .sheet { background: var(--sheet); width: 100%; max-width: 600px; max-height: 92vh; overflow-y: auto; border-radius: 12px 12px 0 0; padding-bottom: calc(env(safe-area-inset-bottom) + 24px); }
  .sheet-bar { position: sticky; top: 0; z-index: 1; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 6px 16px 10px; background: var(--sheet); }
  .sheet-bar::before { content: ''; position: absolute; top: 5px; left: 50%; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: var(--label3); }
  .sheet-bar .ttl { font-weight: 600; padding-top: 12px; text-align: center; }
  .sheet-bar button { border: 0; background: none; color: var(--tint); padding: 12px 0 0; justify-self: start; }
  .sheet-bar button.r { justify-self: end; font-weight: 600; }
  .field { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .field input, .field select { border: 0; background: none; text-align: right; color: var(--label2); padding: 0; min-width: 0; flex: 1; -webkit-appearance: none; appearance: none; }
  .field select { direction: rtl; }
  .field input:focus { outline: none; color: var(--label); }
  .err { color: var(--red); font-size: 13px; padding: 7px 16px 0; min-height: 20px; }
  .btn { display: block; width: 100%; border: 0; border-radius: 12px; background: var(--tint); color: #fff; font-weight: 600; padding: 15px; cursor: pointer; }
  .btn.green { background: var(--green); }
  .btn.plain { background: var(--cell); color: var(--tint); }
  .big-amount { text-align: center; font-size: 34px; font-weight: 700; padding: 6px 16px 0; font-variant-numeric: tabular-nums; }
  .shot { width: 100%; display: block; border-radius: 12px; }
  /* Charts: four category groups, each with its own color. */
  :root { --g-family: #bf5af2; --g-needs: #64d2ff; --g-wants: #ffd60a; --g-other: #98989d; }
  /* Home: the top card's color says how you're doing (green on track, amber careful, red over). */
  .mood { border-radius: 28px; padding: 16px 18px 18px; text-align: center; }
  .mood.good { background: #1e6b45; --on: #c9f2db; } .mood.tight { background: #7a4b0a; --on: #ffe2b0; }
  .mood.over { background: #7a1f1f; --on: #ffd0cc; } .mood.calm { background: var(--cell); --on: var(--label2); }
  .mood-top { display: flex; justify-content: space-between; font-size: 15px; color: var(--on); }
  .mood-top b { color: #fff; font-weight: 700; font-size: 17px; }
  .mood .ring-c b { font-size: 34px; font-weight: 700; color: #fff; letter-spacing: .3px; }
  .mood .ring-c span { font-size: 14px; color: var(--on); }
  .mood-line { font-size: 15px; color: var(--on); margin-top: 6px; }
  .mood-why { display: flex; justify-content: space-between; gap: 12px; margin-top: 14px; padding-top: 12px; border-top: .5px solid rgba(255,255,255,.2); font-size: 14px; color: var(--on); text-align: left; }
  .mood-why b { color: #fff; font-weight: 600; flex: none; }
  .more { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 22px 16px 0; padding: 14px; border-radius: 16px; background: var(--cell); color: var(--label2); font-size: 15px; cursor: pointer; }
  .hero-row { display: flex; align-items: center; gap: 14px; }
  .hero-row > .main { min-width: 0; }
  .hero-row .v { font-size: 32px; white-space: nowrap; }
  .hero-row .v small { font-size: 17px; }
  .ring { position: relative; flex: none; }
  .ring svg { display: block; width: 100%; height: 100%; }
  .ring-c { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1.15; }
  .ring-c b { font-size: 13px; font-variant-numeric: tabular-nums; }
  .ring-c span { font-size: 11px; color: var(--label2); }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin-top: 14px; font-size: 13px; }
  .legend div { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .legend .num { margin-left: auto; color: var(--label2); }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .chart { padding: 12px 12px 8px; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { font: 10px -apple-system, sans-serif; fill: var(--label2); }
  .stack { display: flex; height: 12px; border-radius: 6px; overflow: hidden; gap: 2px; background: var(--fill); }
  .stack > div { height: 100%; }
  .emo { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none; font-size: 17px; background: var(--fill); }
  /* Budget bar: the fill is what you spent, the bold white line is the budget. Past the line = over. */
  .seg { display: flex; background: var(--fill); border-radius: 10px; padding: 2px; margin: 12px 16px 0; }
  .seg button { flex: 1; border: 0; background: none; padding: 8px 0; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--label2); cursor: pointer; }
  .seg button.on { background: #636366; color: #fff; }
  .seg.small { margin: 0 0 10px; } .seg.small button { padding: 6px 0; font-size: 13px; }
  .grp-h .chev { transition: transform .15s; } .grp-h.open .chev { transform: rotate(90deg); }
  .grp-body { background: rgba(255,255,255,.03); }
  .hbar { height: 8px; border-radius: 4px; background: var(--fill); margin-top: 6px; overflow: hidden; } .hbar > div { height: 100%; border-radius: 4px; }
  .bbar { position: relative; height: 10px; border-radius: 5px; background: var(--fill); margin: 9px 4px 4px 0; }
  .bbar > .bfill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 5px; }
  .bbar > .bline { position: absolute; top: -5px; bottom: -5px; width: 3px; margin-left: -1.5px; border-radius: 2px; background: #fff; }
  .share { height: 4px; border-radius: 2px; background: var(--fill); margin-top: 6px; overflow: hidden; }
  .share > div { height: 100%; border-radius: 2px; }
  .why { display: flex; justify-content: space-between; gap: 12px; margin-top: 12px; padding-top: 11px; border-top: .5px solid var(--sep); font-size: 15px; color: var(--label2); }
  .why .link { flex: none; }
  .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 64px); transform: translateX(-50%); z-index: 20; display: none; align-items: center; gap: 16px;
    padding: 12px 18px; border-radius: 14px; background: rgba(28,28,30,.94); color: #fff; font-size: 15px; box-shadow: 0 6px 24px rgba(0,0,0,.25); white-space: nowrap; }
  .toast button { border: 0; background: none; color: #64d2ff; font-weight: 600; padding: 0; }
  .check[disabled] { opacity: .6; }
  .check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--label3); flex: none; display: grid; place-items: center; color: #fff; background: none; padding: 0; cursor: pointer; }
  .check.on { background: var(--green); border-color: var(--green); }
  .check svg { width: 14px; height: 14px; }
  .chip.blue { background: var(--tint-soft); color: var(--tint); }
  .acct { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex: none; background: #fff; padding: 6px; font-weight: 800; font-size: 15px; color: #fff; }
  .acct.sm { width: 24px; height: 24px; border-radius: 7px; padding: 3px; font-size: 9px; }
  .acct img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .acct svg { width: 22px; height: 22px; } .acct.sm svg { width: 13px; height: 13px; }
  .cat-head { display: flex; flex-direction: column; align-items: center; padding: 4px 16px 0; }
  .cat-head .emo { width: 56px; height: 56px; border-radius: 16px; font-size: 30px; }
</style>

<body>
<div id="app"><p class="status" style="padding-top:40vh">Loading…</p></div>
<nav class="tabbar"><div class="in">
  <button data-tab="home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2 2.5 11h2.7v9h5.3v-5.5h3V20h5.3v-9h2.7z"/></svg>Home</button>
  <button data-tab="transactions"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="6" r="1.6"/><circle cx="5" cy="12" r="1.6"/><circle cx="5" cy="18" r="1.6"/><rect x="9" y="5" width="12" height="2" rx="1"/><rect x="9" y="11" width="12" height="2" rx="1"/><rect x="9" y="17" width="12" height="2" rx="1"/></svg>Spending</button>
  <button data-tab="activity"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Activity<span class="badge" id="badge" hidden></span></button>
</div></nav>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status"><span id="toastText"></span><button id="toastUndo">Undo</button></div>
<script>
const API = 'https://vxyofgwxkeruvaxqqzhq.supabase.co/functions/v1/api';
const INGEST = API.replace(/\/api$/, '/ingest');
const params = new URLSearchParams(location.search);
const store = { get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (_) { return null; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} } };
if (params.get('k')) store.set('money:key', params.get('k'));
const KEY = params.get('k') || store.get('money:key');

const S = { tab: (store.get('money:tab') === 'summary' ? 'home' : store.get('money:tab')) || 'home', data: store.get('money:dash'),
  activity: store.get('money:activity'), cycle: null, filter: null, showAll: false, loading: false, error: '', at: 0, more: store.get('money:more') === true,
  range: store.get('money:range') || '7', chartBy: store.get('money:chartBy') || 'time', groupBy: store.get('money:groupBy') || 'category',
  open: null, planAll: false };
let poll = null;

// Money: full for details, short everywhere else (no walls of zeros).
const rp = n => (n < 0 ? '−' : '') + 'Rp' + String(Math.abs(Math.round(n || 0))).replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const rs = n => {
  const v = Math.abs(Math.round(n || 0)), sign = n < 0 ? '−' : '', dec = x => (Math.round(x * 10) / 10).toString().replace('.', ',');
  if (v >= 1e9) return sign + 'Rp' + dec(v / 1e9) + ' M';
  if (v >= 1e6) return sign + 'Rp' + dec(v / 1e6) + ' jt';
  if (v >= 1e3) return sign + 'Rp' + Math.round(v / 1e3) + ' rb';
  return sign + 'Rp' + v;
};
const shorten = text => String(text || '').replace(/Rp\s?(\d{1,3}(?:\.\d{3})+)(?:,\d+)?/g, (_, n) => rs(Number(n.replace(/\./g, ''))));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ago = ms => { if (!ms) return 'No balance yet'; const d = Math.floor((Date.now() - ms) / 864e5); return d <= 0 ? 'Today' : d === 1 ? 'Yesterday' : d + ' days ago'; };
const when = ms => new Date(ms).toLocaleString([], { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const shortDay = ymd => new Date(ymd + 'T00:00:00').toLocaleDateString([], { day: 'numeric', month: 'short' });
const paydayLabel = d => new Date(d.cycle.nextStart + 'T00:00:00').toLocaleDateString([], { day: 'numeric', month: 'short' });
const ICON = {
  spark: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 6.6L21 11l-6.6 2.4L12 20l-2.4-6.6L3 11l6.6-2.4z"/></svg>',
  ok: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="10.4" y="3.5" width="3.2" height="11.5" rx="1.6"/><circle cx="12" cy="19.2" r="1.9"/></svg>',
  dup: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
  none: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M8 12h8"/></svg>',
};

// ---------- Categories and charts ----------

const GROUPS = [['Family', 'var(--g-family)'], ['Needs', 'var(--g-needs)'], ['Wants', 'var(--g-wants)'], ['Other', 'var(--g-other)']];
const catInfo = (d, name) => (d.categoryInfo || []).find(c => c.name === name)
  || { name, group: 'Other', icon: name === 'Investing' ? '📈' : name === 'Emergency fund' ? '🛟' : '📦', hint: '' };
const groupColor = g => (GROUPS.find(x => x[0] === g) || GROUPS[3])[1];
const emo = (d, name) => { const c = catInfo(d, name); return `<div class="emo" style="background:color-mix(in srgb, ${groupColor(c.group)} 20%, transparent)">${esc(c.icon || '📦')}</div>`; };
const dayNum = s => Number(s.slice(8, 10));
const isWeekendKey = ymd => [0, 6].includes(new Date(ymd + 'T00:00:00').getDay());
const limitFor = (d, ymd) => d.spend.perWeekend && isWeekendKey(ymd) ? d.spend.perWeekend : d.spend.perDay;
const todayKey = d => new Date(d.now + 7 * 3600e3).toISOString().slice(0, 10); // WIB date

/** Spending per category and per group for the cycle, biggest first. */
function spendTree(d) {
  const cats = d.budgets.rows.filter(r => r.spent > 0).map(r => ({ ...r, ...catInfo(d, r.category) })).sort((a, b) => b.spent - a.spent);
  const groups = GROUPS.map(([g, color]) => ({ group: g, color, spent: cats.filter(c => (GROUPS.some(x => x[0] === c.group) ? c.group : 'Other') === g).reduce((s, c) => s + c.spent, 0) })).filter(g => g.spent > 0);
  return { cats, groups };
}

/** Donut: colored parts on a grey track. `total` is the whole ring (the budget, or what was spent). */
function ring(parts, total, size, center) {
  const r = 40, c = 2 * Math.PI * r, gap = parts.filter(p => p.v > 0).length > 1 ? 1.2 : 0;
  let off = 0;
  const arcs = parts.filter(p => p.v > 0).map(p => {
    const len = Math.max(0.6, c * Math.min(1, p.v / total) - gap);
    const el = `<circle r="${r}" cx="50" cy="50" fill="none" stroke-width="13" style="stroke:${p.color}" stroke-dasharray="${len} ${c}" stroke-dashoffset="${-off}" transform="rotate(-90 50 50)"/>`;
    off += len + gap; return el;
  }).join('');
  return `<div class="ring" style="width:${size}px;height:${size}px"><svg viewBox="0 0 100 100"><circle r="${r}" cx="50" cy="50" fill="none" stroke-width="13" style="stroke:var(--fill)"/>${arcs}</svg><div class="ring-c">${center}</div></div>`;
}

/** Spent against budget: fill = spent, bold line = the budget. Green, amber from 80%, red when past the line. */
function budgetBar(spent, limit) {
  if (!limit) return `<div class="bbar"><div class="bfill" style="width:100%;background:var(--label3)"></div></div>`;
  const scale = Math.max(limit, spent), color = spent > limit ? 'var(--red)' : spent >= limit * 0.8 ? 'var(--orange)' : 'var(--green)';
  return `<div class="bbar"><div class="bfill" style="width:${Math.max(1, spent / scale * 100)}%;background:${color}"></div><div class="bline" style="left:${limit / scale * 100}%"></div></div>`;
}
/** "Rp210 rb left" in green/amber or "Rp40 rb over" in red. */
function budgetLeft(spent, limit) {
  if (!limit) return `<span class="d">No budget</span>`;
  return spent > limit ? `<span class="red">${rs(spent - limit)} over</span>` : `<span class="${spent >= limit * 0.8 ? 'orange' : 'green'}">${rs(limit - spent)} left</span>`;
}

/** Very short amounts for crowded charts: 222 (= Rp222 rb), 1,1jt. */
const tiny = v => v >= 1e6 ? String(Math.round(v / 1e5) / 10).replace('.', ',') + 'jt' : String(Math.round(v / 1000));

/** Bars with their amount written on top and a name under each; optional dashed limit line with its value. */
function labeledBars(values, color, line, lineLabel) {
  const W = 320, H = 160, top = 22, base = H - 22, n = values.length || 1, step = W / n, bw = Math.min(30, step * 0.62);
  const max = Math.max(1, line || 0, ...values.map(v => Math.max(v.v, v.lim || 0))), y = v => base - (v / max) * (base - top);
  const perBar = values.some(v => v.lim !== undefined);
  const bars = values.map((p, i) => {
    const lim = p.lim !== undefined ? p.lim : line, cx = i * step + step / 2, h = p.v ? Math.max(3, base - y(p.v)) : 0, over = lim && p.v > lim;
    return `${h ? `<rect x="${cx - bw / 2}" y="${base - h}" width="${bw}" height="${h}" rx="4" style="fill:${over ? 'var(--red)' : color};opacity:${p.hl ? 1 : .75}"/>` : `<rect x="${cx - bw / 2}" y="${base - 2}" width="${bw}" height="2" rx="1" style="fill:var(--fill)"/>`}
      <text x="${cx}" y="${base - h - 6}" text-anchor="middle" style="font-size:${n > 8 ? 9 : 10}px;font-weight:600;fill:${p.v ? 'var(--label)' : 'var(--label3)'}">${p.v ? esc(n > 8 ? tiny(p.v) : rs(p.v).replace('Rp', '')) : '0'}</text>
      <text x="${cx}" y="${H - 6}" text-anchor="middle" style="font-size:10px;fill:${p.hl ? 'var(--label)' : 'var(--label2)'};font-weight:${p.hl ? 600 : 400}">${esc(p.label)}</text>
      ${perBar && lim ? `<line x1="${i * step + 2}" x2="${(i + 1) * step - 2}" y1="${y(lim)}" y2="${y(lim)}" stroke-dasharray="4 3" style="stroke:var(--label2)" stroke-width="1"/>` : ''}`;
  }).join('');
  const ln = line && !perBar ? `<line x1="0" x2="${W}" y1="${y(line)}" y2="${y(line)}" stroke-dasharray="4 3" style="stroke:var(--label2)" stroke-width="1"/>
    <text x="2" y="${y(line) - 4}" style="font-size:10px;fill:var(--label2)">${esc(lineLabel || '')}</text>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" role="img"><line x1="0" x2="${W}" y1="${base}" y2="${base}" style="stroke:var(--sep)" stroke-width=".5"/>${ln}${bars}</svg>`;
}

/** Bars per day across the cycle, with an optional dashed "daily limit" line. */
function dayBars(d, values, color, line) {
  const W = 320, H = 120, top = 14, base = H - 18, n = values.length || 1, step = W / n, bw = Math.max(2, step * 0.66);
  const today = todayKey(d), max = Math.max(1, line || 0, ...values.map(v => v.v));
  const y = v => base - (v / max) * (base - top);
  const bars = values.map((p, i) => {
    const x = i * step + (step - bw) / 2, future = d.cycle.isCurrent && p.date > today;
    if (future) return `<rect x="${x}" y="${base - 2}" width="${bw}" height="2" rx="1" style="fill:var(--fill)"/>`;
    const h = Math.max(p.v ? 2 : 0, base - y(p.v));
    return h ? `<rect x="${x}" y="${base - h}" width="${bw}" height="${h}" rx="${Math.min(2, bw / 2)}" style="fill:${color};opacity:${p.date === today ? 1 : .55}"/>` : '';
  }).join('');
  const label = (i, text, anchor) => `<text x="${Math.min(W, Math.max(0, i * step + step / 2))}" y="${H - 4}" text-anchor="${anchor}">${esc(text)}</text>`;
  const ti = values.findIndex(p => p.date === today);
  const labels = label(0, dayNum(values[0].date) + ' ' + new Date(values[0].date + 'T00:00:00').toLocaleDateString([], { month: 'short' }), 'start')
    + (ti > 3 && ti < n - 4 ? label(ti, 'Today', 'middle') : '') + label(n - 1, String(dayNum(values[n - 1].date)), 'end');
  const ln = line ? `<line x1="0" x2="${W}" y1="${y(line)}" y2="${y(line)}" stroke-dasharray="4 3" style="stroke:var(--label2)" stroke-width="1"/>
    <text x="${W}" y="${y(line) - 4}" text-anchor="end">${esc(rs(line))} a day</text>` : '';
  return `<svg viewBox="0 0 ${W} ${H}" role="img"><line x1="0" x2="${W}" y1="${base}" y2="${base}" style="stroke:var(--sep)" stroke-width=".5"/>${bars}${ln}${labels}</svg>`;
}

async function api(method, body, query) {
  const res = await fetch(API + (query || ''), { method, cache: 'no-store',
    headers: { 'x-key': KEY, ...(body ? { 'content-type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || data.message || 'HTTP ' + res.status);
  return data;
}

async function load() {
  if (!KEY) { document.getElementById('app').innerHTML = '<div class="empty">Open the dashboard with your private link (it ends in ?k=…).</div>'; return; }
  S.loading = true; S.error = ''; status();
  try {
    const jobs = [api('GET', null, S.cycle ? '?cycle=' + S.cycle : '')];
    if (S.tab === 'activity') jobs.push(api('GET', null, '?view=activity'));
    const [d, a] = await Promise.all(jobs);
    S.data = d; if (!S.cycle) store.set('money:dash', d);
    if (a) { S.activity = a; store.set('money:activity', a); }
    S.at = Date.now();
    render();
    clearTimeout(poll);
    if (d.reports.pending.length && document.visibilityState === 'visible') poll = setTimeout(load, 15000);
  } catch (e) {
    S.error = e.message === 'Failed to fetch' || e.message === 'Load failed' ? 'Offline · showing your last numbers' : e.message;
  } finally { S.loading = false; status(); }
}

function status() {
  const el = document.getElementById('status');
  if (el) el.textContent = S.error || (S.loading ? 'Updating…' : S.at ? 'Updated ' + new Date(S.at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '');
}

// ---------- Home ----------

/** Approved budgets the CFO's latest plan would now set differently: [{category, from, to}]. */
function cfoChanges(d) {
  const p = d.reports.latest;
  if (!p || d.budgets.state !== 'approved' || !p.budget_proposal || p.created_at < (d.budgets.approvedAt || 0)) return [];
  return p.budget_proposal.filter(x => x.category !== 'Emergency fund').map(x => {
    const row = d.budgets.rows.find(r => r.category === x.category);
    return { category: x.category, from: row ? row.limit : 0, to: x.amount };
  }).filter(x => Math.abs(x.to - x.from) >= 10000);
}

function nextStep(d) {
  const n = d.improve ? d.improve.items.length : 0;
  if (d.budgets.state === 'proposed' && d.cycle.isCurrent) return { act: 'plan', title: 'Approve your budget', sub: 'About 1 minute · your CFO already filled it in' };
  const changes = cfoChanges(d).length;
  if (changes && d.cycle.isCurrent) return { act: 'plan', title: "Review the CFO's new budget", sub: `${changes} change${changes === 1 ? '' : 's'} · about 1 minute` };
  if (d.toCheck) return { act: 'review', title: `Check ${d.toCheck} transaction${d.toCheck === 1 ? '' : 's'}`, sub: 'About 1 minute · tap "Looks right" or fix it' };
  const missing = (d.pay || []).find(p => p.state === 'missing');
  if (missing && d.cycle.isCurrent) return { act: 'gotoPay', title: `Log your ${shortDay(missing.date)} pay`, sub: 'Screenshot it in your bank app · so the CFO sees all your income' };
  if (d.claims && d.claims.todo.length) return { act: 'gotoClaims', title: `Claim back ${rs(d.claims.total)}`, sub: `${d.claims.todo.length} medical bill${d.claims.todo.length === 1 ? '' : 's'} · tick each one when claimed` };
  const p = d.reports.latest, todo = p && (p.actions || []).findIndex((_, i) => !(p.actions_done || []).includes(i));
  if (p && todo >= 0) return { act: 'gotoCfo', title: shorten(p.actions[todo]), sub: 'From your CFO · tick it when done' };
  if (n) return { act: 'gotoImprove', title: `Send ${n} note${n === 1 ? '' : 's'} to Claude`, sub: 'About 1 minute · copy, then paste in Claude Code' };
  const stale = d.netWorth.accounts.filter(a => !a.hasSnapshot && a.name !== 'Cash');
  if (stale.length) return { act: '', title: `Screenshot your ${stale[0].name} balance`, sub: 'So your total is complete' };
  return null;
}

/** Spent vs left as one ring: a color per group, grey for what is left. */
function spentRing(d, size) {
  const { groups } = spendTree(d), sp = d.spend, budget = sp.limit > 0;
  const total = budget ? Math.max(sp.limit, d.spent) : Math.max(1, d.spent);
  const center = budget
    ? (sp.left >= 0 ? `<b>${rs(sp.left)}</b><span>left</span>` : `<b class="red">${rs(-sp.left)}</b><span>over</span>`)
    : `<b>${rs(d.spent)}</b><span>spent</span>`;
  return ring(groups.map(g => ({ v: g.spent, color: g.color })), total, size, center);
}

function spentLegend(d) {
  const { groups } = spendTree(d), sp = d.spend;
  const items = groups.map(g => `<div><span class="dot" style="background:${g.color}"></span>${esc(g.group)}<span class="num">${rs(g.spent)}</span></div>`);
  if (sp.limit > 0 && sp.left > 0) items.push(`<div><span class="dot" style="background:var(--fill)"></span>Left<span class="num">${rs(sp.left)}</span></div>`);
  return items.length ? `<div class="legend tap" data-tab="transactions">${items.join('')}</div>` : '';
}

/** Where "You can spend X a day" comes from: room left per category, minus what is already over. */
function room(d) {
  const days = Math.max(1, d.cycle.daysLeft), rows = d.budgets.rows.filter(r => !r.reserve).map(r => ({ ...r, ...catInfo(d, r.category) }));
  const done = rows.filter(r => r.limit && fixedDone(d, r.category) && r.spent <= r.limit * 1.02);
  const open = rows.filter(r => !done.includes(r) && r.limit > r.spent).map(r => ({ ...r, left: r.limit - r.spent, perDay: Math.floor((r.limit - r.spent) / days / 1000) * 1000 }))
    .sort((a, b) => b.left - a.left);
  const over = rows.filter(r => !done.includes(r) && r.spent > r.limit).map(r => ({ ...r, over: r.spent - r.limit })).sort((a, b) => b.over - a.over);
  return { days, open, over, done, roomTotal: open.reduce((s, r) => s + r.left, 0), overTotal: over.reduce((s, r) => s + r.over, 0) };
}

function whyLine(d) {
  const r = room(d);
  if (!r.open.length) return 'No room left in any category';
  return 'Most room: ' + r.open.slice(0, 2).map(x => `${x.category} ${rs(x.left)}`).join(' · ');
}

function whySheet() {
  const d = S.data, sp = d.spend, r = room(d);
  const reason = x => x.reason ? shorten(x.reason) : '';
  sheet('Why ' + rs(sp.perDay) + ' a day', `
    <div class="big-amount">${rs(sp.perDay)} <span style="font-size:20px;color:var(--label2)">weekdays</span></div>
    ${sp.perWeekend && sp.perWeekend !== sp.perDay ? `<div class="big-amount" style="padding-top:0">${rs(sp.perWeekend)} <span style="font-size:20px;color:var(--label2)">weekends</span></div>` : ''}
    <div class="footnote" style="text-align:center;padding-top:2px">${sp.left >= 0 ? rs(sp.left) + ' left until payday (' + paydayLabel(d) + ')' : rs(-sp.left) + ' over budget'}${sp.weekendRatio > 1 ? ` · a weekend day gets ${String(sp.weekendRatio).replace('.', ',')}× a weekday, from your own habits` : ''}</div>
    <div class="section"><div class="header"><span>OK to spend here</span><span>${rs(r.roomTotal)}</span></div><div class="group">
      ${r.open.length ? r.open.map(x => `<div class="cell tap" data-act="cat" data-id="${esc(x.category)}">${emo(d, x.category)}<div class="main">
        <div class="field"><span class="t">${esc(x.category)}</span><span class="num green">${rs(x.left)} left</span></div>
        <div class="s wrap">${x.perDay ? 'About ' + rs(x.perDay) + ' a day' : 'A little left'}${reason(x) ? ' · ' + esc(reason(x)) : ''}</div></div></div>`).join('')
      : '<div class="cell"><div class="main muted">Every category is used up.</div></div>'}
    </div></div>
    ${r.over.length ? `<div class="section"><div class="header"><span>Already over</span><span class="red">−${rs(r.overTotal)}</span></div><div class="group">
      ${r.over.map(x => `<div class="cell tap" data-act="cat" data-id="${esc(x.category)}">${emo(d, x.category)}<div class="main">
        <div class="field"><span class="t">${esc(x.category)}</span><span class="num red">${rs(x.over)} over</span></div>
        <div class="s wrap">${x.limit ? 'Budget ' + rs(x.limit) : 'No budget'} · try not to spend more here</div></div></div>`).join('')}
    </div><div class="footnote">This comes out of the room above.</div></div>` : ''}
    ${r.done.length ? `<div class="section"><div class="header"><span>Done for this cycle</span></div><div class="group">
      ${r.done.map(x => `<div class="cell">${emo(d, x.category)}<div class="main"><div class="t">${esc(x.category)}</div><div class="s">Fixed payment, nothing more to spend</div></div><span class="green">✓ Paid</span></div>`).join('')}
    </div></div>` : ''}
    <div class="footnote" style="padding:12px 32px 0">${whySum(r, sp)}. You can move room between categories: spending more in one leaves less for the others. Your urgent reserve (Other) is not part of this.</div>`);
}

/** The sum behind the number, exact: room − over (± what is left in paid fixed bills) = left. */
function whySum(r, sp) {
  const slack = sp.left - (r.roomTotal - r.overTotal);
  return `Room ${rs(r.roomTotal)}${r.overTotal ? ' − over ' + rs(r.overTotal) : ''}${Math.abs(slack) >= 1000 ? (slack > 0 ? ' + ' : ' − ') + rs(Math.abs(slack)) + ' in paid fixed bills' : ''} = ${rs(sp.left)} left`;
}

/** A fixed category (family transfers, subscriptions) is done once all its fixed payments went out. */
function fixedDone(d, cat) {
  const fx = (d.fixed || []).filter(f => f.category === cat);
  return fx.length > 0 && fx.every(f => f.done !== undefined ? f.done : f.paid >= f.amount);
}

function home(d) {
  const nw = d.netWorth, b = d.budgets, sp = d.spend, r = d.reports, step = nextStep(d);
  const rows = b.rows.filter(x => !x.reserve && (x.limit > 0 || x.spent > 0)), reserve = sp.reserve || { budget: 0, used: 0 };
  const shown = S.showAll ? rows : rows.slice(0, 5);
  const moreOpen = S.more;
  return `
  ${moodCard(d)}
  ${todayCard(d)}

  <div class="section">${step ? `<div class="next" data-act="${step.act}"><div class="main"><div style="font-weight:600">${esc(step.title)}</div><div>${esc(step.sub)}</div></div><span style="font-size:22px">›</span></div>`
    : `<div class="next done"><div class="icon" style="background:var(--green)">${ICON.ok}</div><div class="main"><div style="font-weight:600">All done</div><div class="muted">Nothing needs you right now</div></div></div>`}</div>

  ${incomeCard(d)}

  <div class="more" data-act="toggleMore">${moreOpen ? 'Less ⌃' : 'More ⌄ <span style="color:var(--label3)">CFO · Budget · Pay · Your money</span>'}</div>
  ${moreOpen ? `
  ${cfoSection(d)}

  <div class="section"><div class="header"><span>Budget</span><span>${b.state === 'approved' ? '✓ Approved' : b.state === 'proposed' ? 'Not approved yet' : ''}</span></div><div class="group">
    ${rows.length ? shown.map(x => {
      const paid = x.limit && fixedDone(d, x.category) && x.spent <= x.limit * 1.02;
      const over = x.limit && x.spent > x.limit && !paid, pct = x.limit ? Math.round(x.spent / x.limit * 100) : null;
      const label = paid ? '✓ Paid' : x.limit ? (over ? rs(x.spent - x.limit) + ' over' : rs(x.limit - x.spent) + ' left') : rs(x.spent) + ' spent';
      return `<div class="cell tap" data-act="cat" data-id="${esc(x.category)}">${emo(d, x.category)}<div class="main">
        <div class="field"><span class="t">${esc(x.category)}</span><span class="num ${paid ? 'green' : over ? 'red' : 'd'}">${label}</span></div>
        ${x.limit ? (paid ? `<div class="progress"><div class="done" style="width:100%"></div></div>` : budgetBar(x.spent, x.limit)) : ''}
      </div><span class="chev">›</span></div>`; }).join('') : '<div class="cell"><div class="main muted">No spending yet</div></div>'}
    ${rows.length > 5 ? `<div class="cell tap" data-act="more"><div class="main link">${S.showAll ? 'Show less' : 'Show all ' + rows.length}</div></div>` : ''}
    ${savingRows(d)}
    ${reserve.used ? b.rows.filter(r => r.reserve && r.spent > 0).map(r => `<div class="cell tap" data-act="cat" data-id="${esc(r.category)}">${emo(d, r.category)}<div class="main"><div class="t">${esc(r.category)} · from your emergency fund</div>
      <div class="s wrap">${rs(r.spent)} this cycle · not part of the plan</div></div><span class="chev">›</span></div>`).join('') : ''}
    ${b.state === 'none' && d.cycle.isCurrent ? (r.pending.length ? '<div class="cell"><div class="main muted">Your CFO is writing a budget…</div></div>' : '<div class="cell tap" data-act="ask"><div class="main link">Ask the CFO for a budget</div></div>') : ''}
    ${b.state !== 'none' && d.cycle.isCurrent ? `<div class="cell tap" data-act="plan"><div class="main link">${b.state === 'proposed' ? 'Review and approve' : 'Edit budget'}</div></div>` : ''}
  </div></div>

  ${savingSection(d)}
  ${claimsSection(d)}
  ${paySection(d)}

  ${d.fixed && d.fixed.length ? `<div class="section"><div class="header"><span>Fixed every month</span><span>${rs(d.fixed.reduce((s, f) => s + f.amount, 0))}</span></div><div class="group">
    ${d.fixed.map(f => { const done = f.done !== undefined ? f.done : f.paid >= f.amount; return `<div class="cell">${emo(d, f.category)}<div class="main"><div class="t">${esc(f.label.replace(/\s*\(.*\)$/, ''))}</div><div class="s">${esc(f.category)}</div></div>
      <span class="num ${done ? 'green' : 'd'}">${done ? '✓ ' : ''}${rs(f.amount)}</span></div>`; }).join('')}
  </div><div class="footnote">✓ means it's already paid this cycle.</div></div>` : ''}

  <div class="section"><div class="header"><span>Your money</span><span>${rs(nw.total)}</span></div><div class="group">
    ${nw.accounts.map(a => `<div class="cell">${acct(a.name)}<div class="main"><div class="t">${esc(a.name)}</div><div class="s">${esc(ago(a.asOf))}</div></div><span class="num ${a.hasSnapshot ? '' : 'muted'}">${a.hasSnapshot ? rs(a.balance) : '—'}</span></div>`).join('')}
  </div>${nw.runwayMonths !== null ? `<div class="footnote">Enough for about ${String(nw.runwayMonths).replace('.', ',')} months of normal spending.</div>` : ''}</div>

  <div class="section"><div class="group">
    <div class="cell tap" data-act="prev"><div class="main link">See last cycle</div></div>
    ${!d.cycle.isCurrent ? '<div class="cell tap" data-act="current"><div class="main link">Back to this cycle</div></div>' : ''}
    <a class="cell tap link" href="${esc(API)}?export=csv&k=${encodeURIComponent(KEY)}">Export to Excel (CSV)</a>
    <div class="cell tap" data-act="copy"><div class="main link">Copy Shortcut URL</div></div>
  </div><div class="footnote">AI cost this cycle: $${d.aiCost.toFixed(2)} · ${d.screenshots} screenshots</div></div>` : ''}`;
}

/** Where the income goes: fixed (Family, Bills, Emergency fund), investing, adjustable (the everyday categories), and what is not planned yet. */
const FIXED_CATS = ['Family', 'Bills'];
function incomeCard(d) {
  const cap = d.budgets.cap, rows = d.budgets.rows.filter(r => !r.reserve), saving = d.budgets.saving || [];
  if (!cap || d.budgets.state === 'none') return '';
  const sum = (list, f) => list.filter(f).reduce((a, r) => a + r.limit, 0);
  const fixed = sum(rows, r => FIXED_CATS.includes(r.category)) + sum(saving, r => r.category === 'Emergency fund');
  const investing = sum(saving, r => r.category === 'Investing');
  const adjustable = sum(rows, r => !FIXED_CATS.includes(r.category));
  const free = Math.max(0, cap - fixed - investing - adjustable);
  const over = fixed + investing + adjustable - cap;
  const parts = [['Fixed', fixed, 'var(--label3)'], ['Investing', investing, 'var(--g-family)'], ['Adjustable', adjustable, 'var(--green)'], ['Not planned', free, 'var(--fill)']].filter(p => p[1] > 0);
  const adjRows = rows.filter(r => !FIXED_CATS.includes(r.category)).sort((a, b) => b.limit - a.limit);
  return `<div class="section"><div class="group"><div class="cell tap" data-act="plan" style="display:block">
    <div class="field"><span style="font-weight:600">Your ${rs(cap)} a cycle</span><span class="d" style="font-size:15px">${over > 0 ? '<span class="red">' + rs(over) + ' over</span>' : 'Edit ›'}</span></div>
    <div class="stack" style="margin-top:10px">${parts.map(p => `<div style="width:${p[1] / cap * 100}%;background:${p[2]}"></div>`).join('')}</div>
    <div class="legend" style="margin-top:10px">${parts.map(p => `<div><span class="dot" style="background:${p[2]}"></span>${p[0]}<span class="num">${rs(p[1])}</span></div>`).join('')}</div>
    <div class="s wrap" style="margin-top:10px"><b style="font-weight:600;color:var(--label)">You can adjust ${rs(adjustable)}</b> · ${adjRows.map(r => esc(r.category) + ' ' + rs(r.limit)).join(' · ')}</div>
    <div class="s wrap" style="margin-top:4px">Fixed: ${rows.filter(r => FIXED_CATS.includes(r.category)).map(r => esc(r.category) + ' ' + rs(r.limit)).concat(saving.filter(r => r.category === 'Emergency fund').map(r => 'Emergency fund ' + rs(r.limit))).join(' · ')}</div>
  </div></div></div>`;
}

/** What today looks like: spent so far (fixed bills left out) against today's share of what is left. */
function todayInfo(d) {
  const key = todayKey(d), day = (d.daily || []).find(x => x.date === key);
  const spent = day ? day.amount - (day.fixed || 0) - (day.other || 0) : 0; // fixed bills and the urgent reserve stay out
  const sp = d.spend;
  const limit = d.cycle.isCurrent && sp.perDay !== null ? (sp.today !== undefined && sp.today !== null ? sp.today : sp.perDay) : null;
  const group = (d.days || []).find(g => g.date === key);
  return { spent, limit, txs: group ? group.txs.filter(t => t.spending && !t.fixed && t.category !== 'Other') : [] };
}

function mood(d) {
  const sp = d.spend, t = todayInfo(d);
  if (!d.cycle.isCurrent || sp.perDay === null) return 'calm';
  if (sp.left < 0) return 'over';
  if (t.limit !== null && t.spent > t.limit) return 'tight';
  return 'good';
}

/** The top card: one big number in a ring (how much of the budget is left), on a color that says how it's going. */
function moodCard(d) {
  const sp = d.spend, m = mood(d), b = d.budgets;
  const top = `<div class="mood-top"><b>Money</b><span>${d.cycle.isCurrent ? d.cycle.daysLeft + ' days to payday' : esc(d.cycle.label)}</span></div>`;
  if (m === 'calm') return `<div class="section"><div class="mood calm">${top}
    ${ring([{ v: 1, color: 'var(--tint)' }], 1, 200, `<span>Spent this cycle</span><b>${rs(d.spent)}</b><span>${d.cycle.isCurrent ? 'Approve a budget for a daily limit' : ''}</span>`).replace('class="ring"', 'class="ring" style="margin:10px auto 0"')}
  </div></div>`;
  const t = todayInfo(d), leftToday = Math.max(0, t.limit - t.spent);
  const leftShare = t.limit > 0 ? leftToday / t.limit : 0; // the ring empties as you spend today, and is full again tomorrow
  const line = m === 'over' ? `${rs(-sp.left)} over budget this cycle` : m === 'tight' ? `Today's limit is used up · ${rs(Math.max(0, sp.left))} left until ${paydayLabel(d)}` : `✓ On track · ${rs(sp.left)} left until ${paydayLabel(d)}`;
  return `<div class="section"><div class="mood ${m} tap" data-act="why">${top}
    <div class="ring" style="width:210px;height:210px;margin:10px auto 0"><svg viewBox="0 0 100 100">
      <circle r="44" cx="50" cy="50" fill="none" stroke-width="7" style="stroke:rgba(255,255,255,.18)"/>
      ${leftShare > 0 ? `<circle r="44" cx="50" cy="50" fill="none" stroke-width="7" stroke-linecap="round" style="stroke:#fff" stroke-dasharray="${Math.max(1, 276.5 * leftShare)} 300" transform="rotate(-90 50 50)"/>` : ''}
    </svg><div class="ring-c"><span>Left to spend today</span><b>${rs(leftToday)}</b><span>${t.spent > t.limit ? rs(t.spent - t.limit) + ' over today' : 'of ' + rs(t.limit) + (isWeekendKey(todayKey(d)) ? ' · weekend' : ' today')}</span></div></div>
    ${sp.perWeekend && sp.perWeekend !== sp.perDay ? `<div class="mood-line" style="margin-top:2px;opacity:.9">${rs(sp.perDay)} on weekdays · ${rs(sp.perWeekend)} on weekends</div>` : ''}
    <div class="mood-line">${line}${b.state === 'proposed' ? ' · budget not approved yet' : ''}</div>
    <div class="mood-why"><span>${esc(whyLine(d))}</span><b>Why ›</b></div>
  </div></div>`;
}

/** Today: what went out today (fixed bills left out), updated after every screenshot. */
function todayCard(d) {
  const t = todayInfo(d);
  if (t.limit === null) return '';
  const shown = t.txs.slice(0, 3);
  return `<div class="section"><div class="header"><span>Today</span><span class="num">${t.spent ? rs(t.spent) + ' spent' : ''}</span></div><div class="group">
    ${shown.length ? shown.map(x => txRow(x, txSub(x) + (x.time ? ' · ' + x.time : ''), 'edit')).join('')
      : '<div class="cell"><div class="main muted">Nothing spent yet today</div></div>'}
    ${t.txs.length > 3 ? `<div class="cell tap" data-tab="transactions"><div class="main link">See all ${t.txs.length}</div></div>` : ''}
  </div></div>`;
}

/** Money set aside this cycle: the emergency fund and investing (with the owner's own split). */
function savingSection(d) {
  const b = d.budgets, e = b.emergency, inv = b.investing || { amount: 0, invested: 0, split: [] };
  if (!e && !inv.amount) return '';
  return `<div class="section" id="saving"><div class="header"><span>Saving this cycle</span><span>${rs((e ? e.amount : 0) + inv.amount)}</span></div><div class="group">
    ${e ? `<div class="cell"><div class="emo">🛟</div><div class="main"><div class="t">Emergency fund</div><div class="s">Move it to your savings pocket</div></div><span class="num">${rs(e.amount)}</span></div>` : ''}
    ${inv.amount ? `<div class="cell" style="display:block"><div class="field"><span>📈 Investing</span><span class="num">${budgetLeft(inv.invested, inv.amount).replace('left', 'to go').replace('over', 'more than planned')}</span></div>
      ${budgetBar(inv.invested, inv.amount)}<div class="s num">Invested ${rs(inv.invested)} of ${rs(inv.amount)}</div>
      ${inv.split && inv.split.length ? inv.split.map(x => `<div class="field s" style="margin-top:4px"><span class="t">${esc(x.place)} · ${x.pct}%${x.moved ? (x.pct ? ' <span class="orange">(+' + x.moved + '%)</span>' : ' <span class="orange">· paused</span>') : ''}</span><span class="num" style="flex:none">${rs(x.amount)}</span></div>`).join('')
        : '<div class="s" style="margin-top:6px">Your split between Bibit, Stockbit and Treasury is not set yet. Tell Claude your split.</div>'}
      ${inv.rule && inv.rule.text ? `<div class="s wrap" style="margin-top:8px;padding-top:8px;border-top:.5px solid var(--sep)">${inv.rule.fired ? '🚨 ' : ''}${esc(inv.rule.text)}${inv.rule.ihsg ? ' · IHSG ' + inv.rule.ihsg.last.toLocaleString('id-ID') + ' on ' + esc(shortDay(inv.rule.ihsg.date)) : ''}</div>` : ''}</div>` : ''}
  </div></div>`;
}

/** Medical bills to claim back from work: tick each one once it is claimed. */
function claimsSection(d) {
  const c = d.claims;
  if (!c || (!c.todo.length && !c.done.length)) return '';
  const row = (x, on) => `<div class="cell"><button class="check ${on ? 'on' : ''}" data-act="claim" data-id="${x.id}" data-on="${on ? 1 : 0}" aria-label="${on ? 'Claimed' : 'Mark as claimed'}">${on ? ICON.ok : ''}</button>
    <div class="main tap" data-act="edit" data-id="${x.id}"><div class="t ${on ? 'muted' : ''}">${esc(x.merchant || 'Medical')}</div><div class="s">${esc(x.label)} · ${esc(x.account)}</div></div>
    <span class="num ${on ? 'muted' : ''}">${rs(x.amount)}</span></div>`;
  return `<div class="section" id="claims"><div class="header"><span>To reimburse</span><span>${c.todo.length ? rs(c.total) : '✓ All claimed'}</span></div><div class="group">
    ${c.todo.map(x => row(x, false)).join('')}${c.done.slice(0, 3).map(x => row(x, true)).join('')}
  </div><div class="footnote">Clinic and hospital bills you paid yourself. Tick ○ once you've claimed it back.</div></div>`;
}

/** Pay this cycle: 25th and 15th, moved to Friday on weekends. */
function paySection(d) {
  const pay = d.pay || [];
  if (!pay.length) return '';
  const got = pay.reduce((s, p) => s + p.amount, 0);
  const want = d.expectedIncome;
  return `<div class="section" id="pay"><div class="header"><span>Pay this cycle</span><span>${want ? rs(got) + ' of ' + rs(want) + ' in' : got ? rs(got) + ' in' : ''}</span></div><div class="group">
    ${pay.map(p => {
      const icon = p.state === 'received' ? `<div class="check on" style="cursor:default">${ICON.ok}</div>` : `<div class="check" style="cursor:default;${p.state === 'missing' ? 'border-color:var(--orange)' : ''}"></div>`;
      const right = p.state === 'received' ? `<span class="num green">+${rs(p.amount)}</span>`
        : p.state === 'missing' ? '<span class="orange" style="font-size:15px">Not logged yet</span>'
        : `<span class="num d">${p.usual ? rs(p.usual) : 'Coming'}</span>`;
      const sub = [p.label, p.moved ? 'moved from the weekend' : '', p.state === 'missing' && p.usual ? rs(p.usual) + ' expected' : ''].filter(Boolean).join(' · ');
      return `<div class="cell">${icon}<div class="main"><div class="t">Pay · ${p.day}${p.day === 1 ? 'st' : p.day === 2 ? 'nd' : p.day === 3 ? 'rd' : 'th'}</div>
        <div class="s">${esc(sub)}</div></div>${right}</div>`;
    }).join('')}
  </div><div class="footnote">Pay comes on the Friday before when the 25th or 15th is a weekend.${pay.some(p => p.state === 'missing') ? ' Screenshot a pay that is not logged yet.' : ''}</div></div>`;
}

/** The CFO: latest advice, its "Do this" checklist, ask for a new plan, history. It only works when asked. */
function cfoSection(d) {
  const r = d.reports, p = r.latest, writing = r.pending.length > 0, acts = (p && p.actions) || [];
  return `<div class="section" id="cfo"><div class="header"><span>Your CFO</span><span>${p ? esc(when(p.created_at)) : ''}</span></div><div class="group">
    ${writing ? `<div class="cell"><div class="icon" style="background:var(--tint)">${ICON.spark}</div><div class="main"><div>Your CFO is thinking…</div><div class="s">About 1 minute. This page updates by itself.</div></div></div>` : ''}
    ${p ? `<div class="cell tap" data-act="report" data-id="${p.id}"><div class="icon" style="background:var(--tint)">${ICON.spark}</div>
      <div class="main"><div class="wrap">${esc(shorten(p.advice_card || p.title))}</div><div class="s">Plan, retro and budget</div></div><span class="chev">›</span></div>` : ''}
    ${acts.map((a, i) => todoRow(p, a, i)).join('')}
    ${p ? emergencyBlock(p, true) : ''}
    ${r.failed && !writing ? `<div class="cell"><div class="main"><div class="red">The last ask didn't work</div><div class="s wrap">${esc(r.failed)}</div></div></div>` : ''}
    ${!writing && d.cycle.isCurrent ? `<div class="cell tap" data-act="ask"><div class="main"><div class="link">${p ? 'Ask the CFO for a new plan' : 'Ask the CFO for a plan'}</div>
      <div class="s wrap">About 1 minute · about $0.06 of AI credit · looks back at the last plan</div></div></div>` : ''}
    ${r.count ? `<div class="cell tap" data-act="history"><div class="main">History</div><span class="num d">${r.count}</span><span class="chev">›</span></div>` : ''}
  </div><div class="footnote">The CFO only works when you ask. Tick each step when it's done, so the next plan knows.</div></div>`;
}

/** The CFO's verdict on the owner's fixed emergency fund plan. */
const EMERGENCY_VERDICT = { enough: ['Enough', 'var(--green)'], not_enough: ['Not enough yet', 'var(--orange)'], more_than_needed: ['More than needed', 'var(--tint)'], unknown: ['Not sure yet', 'var(--label2)'] };
function emergencyBlock(r, compact) {
  const e = r && r.emergency_review;
  if (!e) return '';
  const [label, color] = EMERGENCY_VERDICT[e.verdict] || EMERGENCY_VERDICT.unknown;
  const goal = e.months_to_goal > 0 ? ` · about ${String(Math.round(e.months_to_goal * 10) / 10).replace('.', ',')} months to the goal` : '';
  if (compact) return `<div class="cell tap" data-act="report" data-id="${r.id}"><div class="emo">🛟</div><div class="main"><div class="t">Emergency fund: <span style="color:${color};font-weight:600">${label}</span></div>
    <div class="s wrap">${esc(shorten(e.reason))}</div></div><span class="chev">›</span></div>`;
  return `<div class="section"><div class="header"><span>Your emergency fund plan</span><span style="color:${color};font-weight:600">${label}</span></div><div class="group">
    <div class="cell"><div class="emo">🛟</div><div class="main"><div class="wrap">${esc(shorten(e.reason))}</div>${goal ? `<div class="s">${esc(goal.slice(3))}</div>` : ''}</div></div>
    ${(e.improve || []).map(x => `<div class="cell" style="align-items:flex-start"><span style="color:var(--tint);font-weight:700;width:16px;flex:none">→</span><div class="main wrap">${esc(shorten(x))}</div></div>`).join('')}
  </div></div>`;
}

const todoRow = (p, text, i) => { const on = (p.actions_done || []).includes(i); return `<div class="cell"><button class="check ${on ? 'on' : ''}" data-act="todo" data-id="${p.id}" data-i="${i}" data-on="${on ? 1 : 0}" aria-label="${on ? 'Done' : 'Mark as done'}">${on ? ICON.ok : ''}</button>
  <div class="main wrap ${on ? 'muted' : ''}">${esc(shorten(text))}</div></div>`; };

// ---------- Spending ----------

function txRow(t, sub, act) {
  const color = t.direction === 'in' ? 'green' : t.direction === 'transfer' ? 'muted' : '';
  const amount = (t.direction === 'in' ? '+' : t.direction === 'out' ? '−' : '') + rs(t.amount);
  const chip = t.status === 'check' && !t.reviewed ? '<span class="chip">check</span>'
    : t.spending && t.claim === 'todo' ? '<span class="chip blue">to claim</span>' : '';
  return `<div class="cell ${act ? 'tap' : ''}" data-act="${act || ''}" data-id="${t.id}">${acct(t.direction === 'in' && t.to ? t.to : t.account, true)}<div class="main">
    <div class="t">${esc(t.merchant || t.category)}${chip}</div><div class="s">${esc(sub)}</div></div>
    <span class="num ${color}">${amount}</span></div>`;
}
/** Account badges: the real logos (public-domain SVGs from Wikimedia Commons) on a white tile; a drawn icon for Cash. */
const LOGO = { Mandiri: 'mandiri', Jago: 'jago', GoPay: 'gopay', OVO: 'ovo', DANA: 'dana' };
function acct(name, small) {
  const file = LOGO[name];
  if (file) return `<div class="acct ${small ? 'sm' : ''}" aria-label="${esc(name)}"><img src="logos/${file}.svg" alt=""></div>`;
  if (name === 'Cash') return `<div class="acct ${small ? 'sm' : ''}" style="background:#2e7d32" aria-label="Cash"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="11" rx="2" fill="none" stroke="#fff" stroke-width="2"/><circle cx="12" cy="12.5" r="2.5" fill="#fff"/></svg></div>`;
  return `<div class="acct ${small ? 'sm' : ''}" style="background:#636366" aria-label="${esc(name)}">${esc(String(name || '?').slice(0, 2).toUpperCase())}</div>`;
}
const txSub = t => t.direction === 'transfer' ? t.account + ' → ' + t.to : t.category + ' · ' + t.account;

/** The days the Spending tab looks at: the last 7 or 14 days, or the whole pay cycle (payday to payday). */
function rangeOf(d) {
  const today = d.cycle.isCurrent ? todayKey(d) : d.daily[d.daily.length - 1].date;
  const upto = d.daily.filter(x => x.date <= today);
  const days = S.range === 'cycle' ? upto : upto.slice(-Number(S.range));
  const label = S.range === 'cycle' ? 'this cycle' : `the last ${S.range} days`;
  return { days, from: days.length ? days[0].date : today, to: today, label };
}
const flexOf = x => x.amount - (x.fixed || 0) - (x.other || 0); // everyday spending: no fixed bills, no urgent reserve

const seg = (act, value, items, small) => `<div class="seg ${small ? 'small' : ''}">${items.map(([v, label]) => `<button data-act="${act}" data-id="${v}" class="${v === value ? 'on' : ''}">${label}</button>`).join('')}</div>`;

function transactions(d) {
  if (S.filter) return filteredList(d);
  const r = rangeOf(d);
  const txs = [];
  for (const g of d.days) if (g.date >= r.from && g.date <= r.to) for (const t of g.txs) txs.push({ ...t, day: g.label, date: g.date });
  return `<div class="title-row"><h1 class="large-title">Spending</h1></div>
    <div class="subtitle">${esc(shortDay(r.from))} – ${esc(shortDay(r.to))}${d.cycle.isCurrent ? ' · payday ' + esc(paydayLabel(d)) : ''}</div>
    ${seg('range', S.range, [['7', '7 days'], ['14', '14 days'], ['cycle', 'Full cycle']])}
    ${chartCard(d, r, txs)}
    ${planCard(d)}
    ${groupsCard(d, r, txs)}
    ${(d.ignored || []).length ? `<div class="section"><div class="group"><div class="cell tap" data-act="notCounted"><div class="main">Not counted</div><span class="num d">${d.ignored.length}</span><span class="chev">›</span></div></div></div>` : ''}
    <div class="footnote" style="padding-top:12px">Tap anything to fix it. Repeats of the same transaction are hidden automatically.</div>`;
}

/** The chart for the chosen range: over time (per day, or per week for a whole cycle) or by category. */
function chartCard(d, r, txs) {
  const flex = r.days.map(x => ({ ...x, v: flexOf(x) })), total = flex.reduce((s, x) => s + x.v, 0);
  const avg = total / (flex.length || 1), limit = todayInfo(d).limit || d.spend.perDay || 0;
  const today = todayKey(d), overDays = limit ? flex.filter(x => x.v > (limitFor(d, x.date) || limit)).length : 0;
  let chart;
  if (S.chartBy === 'category') {
    const by = {};
    for (const t of txs) if (t.spending && !t.fixed && t.category !== 'Other') by[t.category] = (by[t.category] || 0) + t.amount;
    const rows = Object.entries(by).sort((a, b) => b[1] - a[1]), sum = rows.reduce((s, x) => s + x[1], 0) || 1;
    chart = rows.length ? `<div style="display:grid;gap:12px">${rows.map(([cat, v]) => `<div class="tap" data-act="cat" data-id="${esc(cat)}">
      <div class="field"><span>${esc(catInfo(d, cat).icon || '')} ${esc(cat)}</span><span class="num"><b style="font-weight:600">${rs(v)}</b> <span class="d">· ${Math.round(v / sum * 100)}%</span></span></div>
      <div class="hbar"><div style="width:${Math.max(2, v / rows[0][1] * 100)}%;background:${groupColor(catInfo(d, cat).group)}"></div></div></div>`).join('')}</div>`
      : '<div class="muted" style="padding:20px 0;text-align:center">Nothing spent in this range</div>';
  } else if (S.range === 'cycle') {
    const weeks = [];
    for (let i = 0; i < flex.length; i += 7) {
      const w = flex.slice(i, i + 7);
      weeks.push({ label: shortDay(w[0].date), v: w.reduce((s, x) => s + x.v, 0), hl: w.some(x => x.date === today) });
    }
    chart = labeledBars(weeks, 'var(--tint)', 0);
  } else {
    chart = labeledBars(flex.map(x => {
      const dt = new Date(x.date + 'T00:00:00');
      return { v: x.v, hl: x.date === today, lim: limitFor(d, x.date) || 0, label: x.date === today ? 'Today' : S.range === '7' ? dt.toLocaleDateString([], { weekday: 'short' }) : String(dt.getDate()) };
    }), 'var(--tint)', limit, '');
  }
  const facts = S.chartBy === 'category' ? 'Share of your everyday spending. Tap a category for its details'
    : `About ${rs(avg)} a day${d.spend.perDay ? ` · limit ${rs(d.spend.perDay)}${d.spend.perWeekend && d.spend.perWeekend !== d.spend.perDay ? ' (' + rs(d.spend.perWeekend) + ' weekends)' : ''}` : ''}${overDays ? ` · <span class="red">${overDays} ${overDays === 1 ? 'day' : 'days'} over</span>` : ''}${S.range === 'cycle' ? ' · bars are weeks' : S.range === '14' ? ' · amounts in rb' : ''}`;
  return `<div class="section"><div class="group chart" style="padding:12px">
    ${seg('chartBy', S.chartBy, [['time', 'Over time'], ['category', 'By category']], true)}
    <div class="field" style="margin:2px 2px 8px"><span class="num" style="font-size:24px;font-weight:700">${rs(total)}</span><span class="d" style="font-size:13px">everyday spending</span></div>
    ${chart}
  </div><div class="footnote">${facts}. Fixed payments and urgent costs are left out.</div></div>`;
}

/** Emergency fund and Investing as budget rows: planned amount, and for Investing how much was actually invested. */
function savingRows(d) {
  return (d.budgets.saving || []).map(r => `<div class="cell tap" data-act="${r.category === 'Investing' ? 'gotoSaving' : 'plan'}" style="align-items:flex-start">${emo(d, r.category)}<div class="main">
    <div class="field"><span class="t">${esc(r.category)}</span><span class="num" style="font-size:15px">${r.category === 'Investing' ? budgetLeft(r.spent, r.limit).replace('left', 'to go').replace('over', 'more than planned') : rs(r.limit)}</span></div>
    ${budgetBar(r.spent, r.limit)}<div class="s num">${r.category === 'Investing' ? 'Invested ' + rs(r.spent) + ' of ' + rs(r.limit) : 'Set aside this cycle · saving, not spending'}</div></div><span class="chev">›</span></div>`).join('');
}

/** The cycle's plan, short: the total and the three categories closest to their budget; the rest on request. */
function planCard(d) {
  const rows = d.budgets.rows.filter(r => !r.reserve && r.category !== 'Family' && (r.limit > 0 || r.spent > 0))
    .sort((a, b) => (b.limit ? b.spent / b.limit : 9) - (a.limit ? a.spent / a.limit : 9));
  if (!rows.length) return '';
  const spent = rows.reduce((s, r) => s + r.spent, 0), limit = rows.reduce((s, r) => s + r.limit, 0), shown = S.planAll ? rows : rows.slice(0, 3);
  return `<div class="section"><div class="header"><span>Your plan this cycle</span><span>${budgetLeft(spent, limit)}</span></div><div class="group">
    <div class="cell" style="display:block"><div class="field"><span class="num" style="font-weight:600">${rs(spent)}</span><span class="d num">of ${rs(limit)}</span></div>${budgetBar(spent, limit)}</div>
    ${shown.map(r => `<div class="cell tap" data-act="cat" data-id="${esc(r.category)}" style="align-items:flex-start">${emo(d, r.category)}<div class="main">
      <div class="field"><span class="t">${esc(r.category)}</span><span class="num" style="font-size:15px">${budgetLeft(r.spent, r.limit)}</span></div>
      ${budgetBar(r.spent, r.limit)}<div class="s num">${rs(r.spent)} of ${r.limit ? rs(r.limit) : 'no budget'}</div></div><span class="chev">›</span></div>`).join('')}
    ${rows.length > 3 ? `<div class="cell tap" data-act="planAll"><div class="main link">${S.planAll ? 'Show less' : 'All ' + rows.length + ' categories'}</div></div>` : ''}
    ${savingRows(d)}
  </div><div class="footnote">White line = budget. Family (fixed) and the urgent reserve are not in the plan.</div></div>`;
}

/** Transactions in the range, grouped by category, day or account. Groups stay closed until you open one. */
function groupsCard(d, r, txs) {
  if (!txs.length) return `<div class="empty">Nothing in ${esc(r.label)}. Double-tap the back of your iPhone on a receipt.</div>`;
  const key = t => S.groupBy === 'day' ? t.date : S.groupBy === 'account' ? (t.direction === 'transfer' ? 'Between accounts' : t.account) : t.category;
  const groups = new Map();
  for (const t of txs) {
    const k = key(t);
    if (!groups.has(k)) groups.set(k, { key: k, txs: [], spent: 0, label: S.groupBy === 'day' ? t.day : k });
    const g = groups.get(k);
    g.txs.push(t);
    if (t.spending) g.spent += t.amount;
  }
  const list = [...groups.values()].sort((a, b) => S.groupBy === 'day' ? (a.key < b.key ? 1 : -1) : b.spent - a.spent || b.txs.length - a.txs.length);
  const icon = g => S.groupBy === 'category' ? emo(d, g.key) : S.groupBy === 'day' ? `<div class="emo" style="font-size:13px;font-weight:700">${esc(String(Number(g.key.slice(8, 10))))}</div>`
    : `<div class="emo" style="font-size:13px;font-weight:700">${esc(g.key.slice(0, 2))}</div>`;
  return `<div class="section"><div class="header"><span>Transactions</span><span>${txs.length}</span></div>
    ${seg('groupBy', S.groupBy, [['category', 'Category'], ['day', 'Day'], ['account', 'Account']], true)}
    <div class="group">${list.map(g => {
      const open = S.open === g.key, shown = g.txs.slice(0, 20);
      return `<div class="cell tap grp-h ${open ? 'open' : ''}" data-act="openGroup" data-id="${esc(g.key)}">${icon(g)}<div class="main">
          <div class="t">${esc(g.label)}</div><div class="s">${g.txs.length} ${g.txs.length === 1 ? 'item' : 'items'}</div></div>

/** The cycle in 7-day blocks with what was spent in each: [{label: '25 Sep', v, hl}]. */
function cycleWeeks(d, byDay) {
  const weeks = [], today = todayKey(d);
  for (let i = 0; i < d.daily.length; i += 7) {
    const days = d.daily.slice(i, i + 7);
    weeks.push({ label: shortDay(days[0].date), v: days.reduce((s, x) => s + (byDay[x.date] || 0), 0), hl: days.some(x => x.date === today) });
  }
  return weeks;
}

/** One category: spent vs budget, week by week, top places and every transaction. */
function catSheet(name) {
  const d = S.data, c = catInfo(d, name), row = d.budgets.rows.find(r => r.category === name) || { spent: 0, limit: 0 };

  const byDay = {}; for (const t of spentTx) byDay[t.date] = (byDay[t.date] || 0) + t.amount;
  const places = {}; for (const t of spentTx) { const k = (t.merchant || '—').trim(); places[k] = places[k] || { name: k, v: 0, n: 0 }; places[k].v += t.amount; places[k].n++; }
  const topPlaces = Object.values(places).sort((a, b) => b.v - a.v).slice(0, 5);
  const color = groupColor(c.group), spent = row.spent, limit = row.limit, paid = limit && fixedDone(d, name) && spent <= limit * 1.02;

  sheet(name, `
    <div class="cat-head">${emo(d, name)}<div class="footnote" style="padding:6px 0 0">${esc(c.group || '')}</div></div>

      ${last ? `<div class="k" style="margin-top:4px">Last cycle ${rs(last)}${last && Math.abs(diff) >= 1000 ? ` · <span class="${diff > 0 ? 'red' : 'green'}">${diff > 0 ? '↑' : '↓'} ${rs(Math.abs(diff))}</span>` : ''}</div>` : ''}
    </div>${ring([{ v: spent, color: paid ? 'var(--green)' : limit && spent > limit ? 'var(--red)' : color }], Math.max(1, limit || spent), 96, center)}</div></div></div></div>
    ${spentTx.length ? `<div class="section"><div class="header"><span>Week by week</span></div>
      <div class="group chart">${labeledBars(cycleWeeks(d, byDay), color, 0)}</div></div>` : ''}
    ${topPlaces.length ? `<div class="section"><div class="header"><span>${c.group === 'Family' && name === 'Family' ? 'Who got it' : 'Top places'}</span></div><div class="group">
      ${topPlaces.map(p => `<div class="cell"><div class="main"><div class="field"><span class="t">${esc(p.name)}</span><span class="num">${rs(p.v)}</span></div>
        <div class="share"><div style="width:${Math.max(2, p.v / topPlaces[0].v * 100)}%;background:${color}"></div></div>

    <div class="section"><div class="header"><span>${txs.length === 1 ? '1 transaction' : txs.length + ' transactions'}</span></div><div class="group">
      ${txs.length ? txs.map(t => txRow(t, t.day + (t.time ? ' · ' + t.time : '') + ' · ' + t.account, 'edit')).join('') : '<div class="cell"><div class="main muted">Nothing this cycle</div></div>'}

// ---------- Activity ----------

function activityInfo(a) {
  if (a.status === 'error') return { icon: ICON.warn, color: 'var(--red)', sub: "Couldn't read" };
  if (a.status === 'duplicate') return { icon: ICON.dup, color: '#8e8e93', sub: 'Sent before · ignored' };
  if (a.status === 'dry_run') return { icon: ICON.none, color: '#8e8e93', sub: 'Test' };
  const saved = a.saved.filter(t => t.status !== 'duplicate?' && t.status !== 'replaced').length;
  const bits = [];
  if (saved) bits.push(saved + ' saved');
  if (a.balances.length) bits.push(a.balances.length === 1 ? '1 balance' : a.balances.length + ' balances');
  if (!bits.length) return { icon: ICON.none, color: '#8e8e93', sub: a.kind === 'not_financial' ? 'Not a bill or balance' : 'Nothing new' };
  return { icon: ICON.ok, color: 'var(--green)', sub: bits.join(' · ') };
}

function activity(d) {
  const items = d.improve ? d.improve.items : [];

function findTx(id) {
  for (const g of S.data.days) for (const t of g.txs) if (t.id === id) return { ...t, day: g.label };

  const c = S.data.claims && S.data.claims.todo.concat(S.data.claims.done).find(x => x.id === id); // a bill from an earlier cycle

}

const moneyValue = el => Number(String(el.value).replace(/[^\d]/g, '')) || 0;
function formatMoneyInput(el) {
  const v = moneyValue(el);
  el.value = v ? String(v).replace(/\B(?=(\d{3})+(?!\d))/g, '.') : '';
  const hint = el.dataset.hint && document.getElementById(el.dataset.hint);
  if (hint) hint.textContent = v ? rs(v) : '';
}

async function saveTx(id) {
  const v = k => document.getElementById(k).value, err = m => { document.getElementById('eErr').textContent = m; };
  const amount = moneyValue(document.getElementById('eAmount'));
  if (!amount) return err('Enter an amount.');
  if (v('eDir') === 'transfer' && !v('eTo')) return err('Choose the account the money went to.');
  try {
    const claim = document.getElementById('eClaim'), before = findTx(id);
    await api('POST', { action: 'update_tx', id, patch: { amount, direction: v('eDir'), category: v('eCat'), account: v('eAcc'), to_account: v('eDir') === 'transfer' ? v('eTo') : '', status: v('eStatus') === 'check' ? 'ok' : v('eStatus'), ...(claim ? { claim: claim.value || null } : {}) } });
    closeSheet(); load();
    if (v('eStatus') === 'ignore' && before && before.status !== 'ignore') {
      toast('Not counted', () => api('POST', { action: 'restore_tx', id, status: before.status, reviewed: before.reviewed }));
    } else toast('Saved');
  } catch (e) { err(e.message); }
}

/** A short message at the bottom with an Undo button, for one-tap actions that are easy to hit by mistake. */
let toastTimer = null, toastUndo = null;
function toast(text, undo) {
  const box = document.getElementById('toast');
  document.getElementById('toastText').textContent = text;
  document.getElementById('toastUndo').hidden = !undo;
  toastUndo = undo || null;
  box.style.display = 'flex';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { box.style.display = 'none'; toastUndo = null; }, 7000);
}
document.getElementById('toastUndo').addEventListener('click', async () => {
  const undo = toastUndo;
  document.getElementById('toast').style.display = 'none'; toastUndo = null;
  if (undo) { try { await undo(); load(); } catch (e) { alert(e.message); } }
});

/** Shows a checkbox as ticked or not, and keeps its state on the element so the next tap does the opposite. */
function setCheck(el, on) {
  el.classList.toggle('on', on); el.innerHTML = on ? ICON.ok : ''; el.dataset.on = on ? '1' : '0';
  el.setAttribute('aria-label', on ? 'Done' : 'Mark as done');
}

async function setClaim(id, claim, el) {
  if (el.disabled) return;
  setCheck(el, claim === 'done'); el.disabled = true;
  try { await api('POST', { action: 'set_claim', id, claim }); }
  catch (e) { setCheck(el, claim !== 'done'); S.error = e.message; status(); }
  finally { el.disabled = false; load(); }
}

}

/** "Rp30,1 jt of your Rp30,5 jt income · Rp400 rb not planned" — the budget can never be more than the income. */
function capLine(total) {
  const cap = S.data && S.data.budgets.cap;
  if (!cap) return 'planned this cycle';
  return total > cap ? `<span class="red">${rs(total - cap)} more than your ${rs(cap)} income</span> · lower something to approve`
    : `of your ${rs(cap)} income · ${rs(cap - total)} not planned yet`;
}

async function approve() {
  const items = [...document.querySelectorAll('input[data-cat]')].map(i => ({ category: i.dataset.cat, amount: moneyValue(i) }));
  const err = m => { document.getElementById('pErr').textContent = m; };
  if (!items.some(i => i.amount > 0)) return err('Enter at least one amount.');
  const total = items.reduce((s, i) => s + i.amount, 0), cap = S.data.budgets.cap;
  if (cap && total > cap) return err(`That's ${rs(total - cap)} more than your income. Lower something first.`);
  try { await api('POST', { action: 'approve_budgets', cycle_start: S.data.cycle.start, items }); closeSheet(); load(); }
  catch (e) { err(e.message); }
}

async function historySheet() {
  const render = () => sheet('CFO history', S.history ? (S.history.length ? `<div class="section" style="margin-top:6px"><div class="group">
    ${S.history.map(r => `<div class="cell tap" data-act="report" data-id="${r.id}"><div class="main">
      <div class="t">${esc(shorten(r.title))}</div><div class="s wrap">${esc(when(r.created_at))}${r.retro && r.retro.verdict ? ' · ' + esc(shorten(r.retro.verdict)) : ''}</div></div><span class="chev">›</span></div>`).join('')}
    </div><div class="footnote">Each answer looks back at the one before it.</div></div>` : '<div class="empty">No answers yet.</div>') : '<p class="status">Loading…</p>');
  render();
  try { S.history = await api('GET', null, '?view=cfo'); render(); }
  catch (e) { document.getElementById('sheet').insertAdjacentHTML('beforeend', `<p class="err">${esc(e.message)}</p>`); }
}

async function setTodo(id, i, done, el) {
  if (el.disabled) return;
  setCheck(el, done); el.disabled = true;
  for (const r of [S.data.reports.latest, ...(S.history || [])]) {
    if (r && r.id === id) r.actions_done = done ? [...new Set([...(r.actions_done || []), i])] : (r.actions_done || []).filter(x => x !== i);
  }
  try { await api('POST', { action: 'toggle_action', id, index: i, done }); }
  catch (e) { setCheck(el, !done); S.error = e.message; status(); }
  finally { el.disabled = false; if (document.getElementById('sheetBg').style.display !== 'flex') render(); load(); }
}

function shotSheet(id) {
  const a = (S.activity || []).find(x => x.id === id);
  if (!a) return;
  const accounts = S.data ? S.data.accountsList : [];
  const saved = a.saved.filter(t => t.status !== 'duplicate?' && t.status !== 'replaced');
  const repeats = a.saved.length - saved.length;
  const left = (a.skipped || []).filter(x => !x.resolved);
  sheet('Screenshot', `
    ${saved.length ? `<div class="section" style="margin-top:6px"><div class="header"><span>Saved</span></div><div class="group">${saved.map(t => txRow(t, txSub(t) + ' · ' + t.date)).join('')}</div>
      ${repeats ? `<div class="footnote">${repeats} already saved from another screenshot, so not counted twice.</div>` : ''}</div>`
      : `<div class="section" style="margin-top:6px"><div class="group"><div class="cell"><div class="main wrap">${esc(shorten(a.notification || a.error || 'Nothing saved'))}</div></div></div></div>`}
    ${a.balances.length ? `<div class="section"><div class="header"><span>Balances</span></div><div class="group">${a.balances.map(x => `<div class="cell"><div class="main">${esc(x.account)}</div><span class="num">${rs(x.balance)}</span></div>`).join('')}</div></div>` : ''}
    ${(a.unassigned || []).length ? `<div class="section"><div class="header"><span>Which account is this?</span></div><div class="group">${a.unassigned.map((u, i) => u.assigned
      ? `<div class="cell"><div class="main"><div class="num">${rs(u.balance_idr)}</div><div class="s">${u.assigned === 'ignore' ? 'Ignored' : 'Saved as ' + esc(u.assigned)}</div></div><span class="link tap" data-act="unassign" data-id="${a.id}" data-i="${i}">Undo</span></div>`
      : `<label class="cell field"><span class="num">${rs(u.balance_idr)}</span><select data-assign="${i}" data-shot="${a.id}"><option value="">Choose</option>${accounts.map(n => `<option>${esc(n)}</option>`).join('')}<option value="ignore">Ignore</option></select></label>`).join('')}</div></div>` : ''}
    ${left.length ? `<div class="section"><div class="header"><span>Not counted</span></div><div class="group">${left.map(x => `<div class="cell"><div class="main"><div class="wrap">${esc(shorten(x.text))}</div><div class="s wrap">${esc(x.reason)}</div></div></div>`).join('')}</div></div>` : ''}
    ${a.hasImage ? `<div class="section"><div class="group"><div class="cell tap" data-act="image" data-id="${a.id}"><div class="main link">Show screenshot</div></div></div><div id="img-${a.id}" style="margin-top:10px"></div></div>` : ''}
    <div class="footnote" style="padding:12px 32px 0">${when(a.at)}${a.cost ? ' · cost $' + a.cost.toFixed(4) : ''}</div>`);
}

async function showImage(id) {
  const box = document.getElementById('img-' + id);
  box.innerHTML = '<p class="status">Loading…</p>';
  try { const { url } = await api('GET', null, '?image=' + encodeURIComponent(id)); box.innerHTML = `<img class="shot" src="${esc(url)}" alt="Screenshot">`; }
  catch (e) { box.innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}

async function unassign(shotId, index) {
  try {
    await api('POST', { action: 'unassign_balance', screenshot_id: shotId, index });
    const a = await api('GET', null, '?view=activity'); S.activity = a; store.set('money:activity', a);
    shotSheet(shotId); load();
  } catch (e) { alert(e.message); }
}

async function assign(sel) {
  if (!sel.value) return;
  try {
    await api('POST', { action: 'assign_balance', screenshot_id: sel.dataset.shot, index: Number(sel.dataset.assign), account: sel.value });
    const a = await api('GET', null, '?view=activity'); S.activity = a; store.set('money:activity', a);
    shotSheet(sel.dataset.shot); load();
  } catch (e) { alert(e.message); sel.value = ''; }
}

function copy(text, el, done) {
  navigator.clipboard.writeText(text).then(() => { el.textContent = done; }, () => { el.textContent = 'Press and hold to copy'; });
}

// ---------- Render and events ----------

function render() {
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  const d = S.data;
  if (!d) return;
  const badge = document.getElementById('badge'), n = d.improve ? d.improve.items.length : 0;
  badge.hidden = !n; badge.textContent = n;
  const body = S.tab === 'transactions' ? transactions(d) : S.tab === 'activity' ? activity(d) : home(d);
  document.getElementById('app').innerHTML = `<div class="screen">${body}<p class="status" id="status"></p></div>`;
  status();
}

/** Opens the "More" part of Home if needed, then scrolls to one of its sections. */
function openMoreAt(id) {
  if (!S.more) { S.more = true; store.set('money:more', true); render(); }
  const box = document.getElementById(id);
  if (box) box.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function goTab(tab) { S.tab = tab; store.set('money:tab', tab); window.scrollTo(0, 0); render(); if (tab === 'activity') load(); }

async function ask() {
  try { await api('POST', { action: 'generate' }); closeSheet(); await load(); openMoreAt('cfo'); }
  catch (e) { closeSheet(); S.error = e.message; status(); alert(e.message); }
}

document.addEventListener('click', e => {
  const tab = e.target.closest('[data-tab]');
  if (tab) { S.filter = null; return goTab(tab.dataset.tab); }
  if (e.target.id === 'sheetBg') return closeSheet();
  const el = e.target.closest('[data-act]');
  if (!el || !el.dataset.act) return;
  const id = el.dataset.id;
  switch (el.dataset.act) {
    case 'edit': editSheet(id); break;
    case 'confirm': confirmTx(id); break;
    case 'save': saveTx(id); break;
    case 'close': closeSheet(); break;
    case 'plan': planSheet(); break;
    case 'approve': approve(); break;
    case 'report': reportSheet(id); break;
    case 'ask': {
      // Costs AI credit, so a mis-tap does nothing: the first tap asks to confirm, the second within 5 seconds asks the CFO.
      if (el.dataset.armed === '1') { ask(); break; }
      el.dataset.armed = '1';
      const label = el.querySelector('.link') || el;
      const before = label.textContent;
      label.textContent = 'Tap again to ask (about $0.06)';
      setTimeout(() => { if (el.isConnected) { el.dataset.armed = ''; label.textContent = before; } }, 5000);
      break;
    }
    case 'unassign': unassign(id, Number(el.dataset.i)); break;
    case 'history': historySheet(); break;
    case 'todo': setTodo(id, Number(el.dataset.i), el.dataset.on !== '1', el); break;
    case 'gotoCfo': openMoreAt('cfo'); break;
    case 'gotoSaving': openMoreAt('saving'); break;
    case 'useSug': { const input = [...document.querySelectorAll('input[data-cat]')].find(x => x.dataset.cat === el.dataset.cat); if (input) { input.value = el.dataset.amount; formatMoneyInput(input); input.dispatchEvent(new Event('input', { bubbles: true })); } break; }
    case 'shot': shotSheet(id); break;
    case 'image': showImage(id); break;
    case 'more': S.showAll = !S.showAll; render(); break;
    case 'cat': catSheet(id); break;
    case 'why': whySheet(); break;
    case 'toggleMore': S.more = !S.more; store.set('money:more', S.more); render(); break;
    case 'review': S.filter = 'review'; goTab('transactions'); break;
    case 'gotoImprove': goTab('activity'); break;
    case 'gotoPay': case 'gotoClaims': openMoreAt(el.dataset.act === 'gotoPay' ? 'pay' : 'claims'); break;
    case 'claim': setClaim(id, el.dataset.on === '1' ? 'todo' : 'done', el); break;
    case 'clearFilter': S.filter = null; render(); break;
    case 'range': S.range = id; S.open = null; store.set('money:range', id); render(); break;
    case 'chartBy': S.chartBy = id; store.set('money:chartBy', id); render(); break;
    case 'groupBy': S.groupBy = id; S.open = null; store.set('money:groupBy', id); render(); break;
    case 'openGroup': S.open = S.open === id ? null : id; render(); break;
    case 'planAll': S.planAll = !S.planAll; render(); break;
    case 'notCounted': notCountedSheet(); break;
    case 'prev': S.cycle = S.data.cycle.prevStart; load(); break;
    case 'current': S.cycle = null; load(); break;
    case 'copy': copy(INGEST, el.querySelector('.main'), 'Copied'); break;
    case 'copyImprove': copy(S.data.improve.report, el, 'Copied · now paste it in Claude Code'); break;
  }
});
document.addEventListener('input', e => { if (e.target.dataset.money !== undefined) {
  formatMoneyInput(e.target);
  const total = document.getElementById('planTotal');
  if (total) {
    const sum = [...document.querySelectorAll('input[data-cat]')].reduce((s, i) => s + moneyValue(i), 0);
    total.textContent = rs(sum); total.classList.toggle('red', !!(S.data.budgets.cap && sum > S.data.budgets.cap));
    document.getElementById('planCap').innerHTML = capLine(sum);
  }
} });
document.addEventListener('change', e => { if (e.target.dataset.assign !== undefined) assign(e.target); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(); });
window.addEventListener('pageshow', e => { if (e.persisted) load(); });

render();
load();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
